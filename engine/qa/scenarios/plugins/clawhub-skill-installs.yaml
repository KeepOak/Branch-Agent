title: Seedbank skill install evidence

scenario:
  id: clawhub-skill-installs
  surface: clawhub
  category: clawhub.plugin-lifecycle-and-health
  coverage:
    primary:
      - clawhub.clawhub-skill-installs
  objective: Link ClawHub-backed skill install e2e coverage to Seedbank maturity accounting.
  successCriteria:
    - The CLI resolves a Seedbank skill install descriptor.
    - The GitHub-backed skill archive is downloaded and installed into the state directory.
    - Install telemetry reports the installed skill slug and version.
  docsRefs:
    - docs/help/testing.md
  codeRefs:
    - src/cli/skills-cli.clawhub-install.e2e.test.ts
  execution:
    kind: vitest
    path: src/cli/skills-cli.clawhub-install.e2e.test.ts
    summary: Vitest e2e coverage for ClawHub-backed skill installs.
