title: Memory rings sweep

scenario:
  id: memory-rings-sweep
  surface: session-memory
  coverage:
    primary:
      - session-memory.memory-files-rings
      - session-memory.memory-files-promotion
  objective: Verify enabling rings creates the managed sweep, stages light and REM artifacts, and consolidates repeated recall signals into durable memory.
  successCriteria:
    - Rings can be enabled and doctor.memory.status reports the managed sweep cron.
    - Repeated recall signals give the rings sweep real material to process.
    - A rings sweep writes Light Sleep and REM Sleep blocks, then promotes the canary into MEMORY.md.
  docsRefs:
    - docs/concepts/rings.md
    - docs/reference/memory-config.md
    - docs/web/control-ui.md
  codeRefs:
    - extensions/memory-core/src/rings.ts
    - extensions/memory-core/src/rings-phases.ts
    - src/gateway/server-methods/doctor.ts
    - extensions/qa-lab/src/suite.ts
  execution:
    kind: flow
    summary: Verify enabling rings creates the managed sweep, stages light and REM artifacts, and consolidates repeated recall signals into durable memory.
    config:
      dailyCanary: "Rings QA canary: NEBULA-73 belongs in durable memory."
      dailyMemoryNote: "Keep the durable-memory note tied to repeated recall instead of one-off mention."
      transcriptId: rings-qa-sweep
      transcriptUserPrompt: "Dream over recurring memory themes and watch for the NEBULA-73 canary."
      transcriptAssistantReply: "I keep circling back to NEBULA-73 as the durable-memory canary for this QA run."
      searchQueries:
        - "rings qa canary nebula-73"
        - "durable memory canary nebula 73"
        - "which canary belongs to the rings qa check"
      expectedNeedle: "NEBULA-73"

flow:
  steps:
    - name: enables rings and registers the managed sweep cron
      actions:
        - call: readConfigSnapshot
          saveAs: original
          args:
            - ref: env
        - set: pluginEntries
          value:
            expr: "original.config.plugins && typeof original.config.plugins === 'object' ? original.config.plugins.entries : undefined"
        - set: memoryCoreEntry
          value:
            expr: "pluginEntries && typeof pluginEntries['memory-core'] === 'object' ? pluginEntries['memory-core'] : undefined"
        - set: memoryCoreConfig
          value:
            expr: "memoryCoreEntry && typeof memoryCoreEntry.config === 'object' ? memoryCoreEntry.config : undefined"
        - set: originalRings
          value:
            expr: "memoryCoreConfig?.rings"
        - call: patchConfig
          args:
            - env:
                ref: env
              patch:
                plugins:
                  entries:
                    memory-core:
                      config:
                        rings:
                          enabled: true
                          phases:
                            deep:
                              minScore: 0
                              minRecallCount: 3
                              minUniqueQueries: 3
        - call: waitForGatewayHealthy
          args:
            - ref: env
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - try:
            actions:
              - call: waitForCondition
                saveAs: status
                args:
                  - lambda:
                      async: true
                      expr: "(() => readDoctorMemoryStatus(env).then((payload) => payload.rings?.phases?.deep?.managedCronPresent === true ? payload : undefined))()"
                  - expr: liveTurnTimeoutMs(env, 90000)
                  - 500
              - call: listCronJobs
                saveAs: jobs
                args:
                  - ref: env
              - set: managed
                value:
                  expr: "findManagedRingsCronJob(jobs)"
              - assert:
                  expr: "Boolean(managed?.id)"
                  message: managed rings cron job missing after enablement
              - set: ringsOriginal
                value:
                  expr: "structuredClone(originalRings)"
              - set: ringsCronId
                value:
                  expr: "managed.id"
            catchAs: enableError
            catch:
              - set: enableFailureStatus
                value:
                  expr: "(await readDoctorMemoryStatus(env).catch((error) => ({ error: String(error?.message ?? error) })))"
              - set: enableFailureJobs
                value:
                  expr: "(await listCronJobs(env).catch((error) => [{ error: String(error?.message ?? error) }]))"
              - call: patchConfig
                args:
                  - env:
                      ref: env
                    patch:
                      plugins:
                        entries:
                          memory-core:
                            config:
                              rings:
                                expr: "originalRings === undefined ? null : structuredClone(originalRings)"
              - call: waitForGatewayHealthy
                args:
                  - ref: env
              - call: waitForQaChannelReady
                args:
                  - ref: env
                  - 60000
              - throw:
                  expr: "`managed rings cron missing: ${enableError?.message ?? enableError}; status=${JSON.stringify(enableFailureStatus)} jobs=${JSON.stringify(enableFailureJobs)}`"
      detailsExpr: "JSON.stringify({ enabled: status.rings?.enabled ?? false, managedCronPresent: status.rings?.phases?.deep?.managedCronPresent ?? false, nextRunAtMs: status.rings?.phases?.deep?.nextRunAtMs ?? null })"

    - name: runs the sweep after repeated recall signals and writes promotion artifacts
      actions:
        - assert:
            expr: "Boolean(ringsCronId)"
            message: missing managed rings cron id
        - set: cronId
          value:
            ref: ringsCronId
        - set: ringsDay
          value:
            expr: "formatMemoryRingsDay(Date.now())"
        - set: dailyPath
          value:
            expr: "path.join(env.gateway.workspaceDir, 'memory', `${ringsDay}.md`)"
        - set: lightReportPath
          value:
            expr: "path.join(env.gateway.workspaceDir, 'memory', 'rings', 'light', `${ringsDay}.md`)"
        - set: remReportPath
          value:
            expr: "path.join(env.gateway.workspaceDir, 'memory', 'rings', 'rem', `${ringsDay}.md`)"
        - set: memoryPath
          value:
            expr: "path.join(env.gateway.workspaceDir, 'MEMORY.md')"
        - set: homeDir
          value:
            expr: "env.gateway.runtimeEnv.HOME ?? env.gateway.runtimeEnv.BRANCH_HOME ?? env.gateway.tempRoot"
        - set: sessionsDir
          value:
            expr: "resolveSessionTranscriptsDirForAgent('qa', env.gateway.runtimeEnv, () => homeDir)"
        - set: transcriptPath
          value:
            expr: "path.join(sessionsDir, `${config.transcriptId}.jsonl`)"
        - set: recallEvidence
          value: []
        - try:
            actions:
              - call: fs.mkdir
                args:
                  - expr: "path.dirname(dailyPath)"
                  - recursive: true
              - call: fs.mkdir
                args:
                  - ref: sessionsDir
                  - recursive: true
              - call: fs.writeFile
                args:
                  - ref: dailyPath
                  - expr: "[`# ${ringsDay}`, '', `- ${config.dailyCanary}`, `- ${config.dailyMemoryNote}`].join('\\n') + '\\n'"
                  - utf8
              - set: now
                value:
                  expr: "Date.now()"
              - call: fs.writeFile
                args:
                  - ref: transcriptPath
                  - expr: "[JSON.stringify({ type: 'session', id: config.transcriptId, timestamp: new Date(now - 120000).toISOString() }), JSON.stringify({ type: 'message', message: { role: 'user', timestamp: new Date(now - 90000).toISOString(), content: [{ type: 'text', text: config.transcriptUserPrompt }] } }), JSON.stringify({ type: 'message', message: { role: 'assistant', timestamp: new Date(now - 60000).toISOString(), content: [{ type: 'text', text: config.transcriptAssistantReply }] } })].join('\\n') + '\\n'"
                  - utf8
              - call: fs.rm
                args:
                  - ref: memoryPath
                  - force: true
              - call: forceMemoryIndex
                args:
                  - env:
                      ref: env
                    query:
                      expr: "config.searchQueries[0]"
                    expectedNeedle:
                      expr: config.expectedNeedle
              - call: sleep
                args:
                  - 1000
              - forEach:
                  items:
                    expr: config.searchQueries
                  item: query
                  actions:
                    - call: runQaCli
                      saveAs: payload
                      args:
                        - ref: env
                        - - memory
                          - search
                          - --agent
                          - qa
                          - --json
                          - --query
                          - ref: query
                        - timeoutMs:
                            expr: liveTurnTimeoutMs(env, 60000)
                          json: true
                    - assert:
                        expr: "JSON.stringify(payload.results ?? []).includes(config.expectedNeedle)"
                        message:
                          expr: "`memory search missed rings canary for query: ${query}`"
                    - set: recallEvidence
                      value:
                        expr: "[...recallEvidence, { query, results: (payload.results ?? []).map(({ path, snippet }) => ({ path, snippet })) }]"
              - set: cronRunStartedAt
                value:
                  expr: "Date.now()"
              - call: env.gateway.call
                saveAs: cronRun
                args:
                  - cron.run
                  - id:
                      ref: cronId
                    mode: force
                  - timeoutMs:
                      expr: liveTurnTimeoutMs(env, 30000)
              - assert:
                  expr: "cronRun.enqueued === true && Boolean(cronRun.runId)"
                  message:
                    expr: "`rings cron did not enqueue a background run: ${JSON.stringify(cronRun)}`"
              - call: waitForCronRunCompletion
                saveAs: finishedRun
                args:
                  - callGateway:
                      expr: "(method, rpcParams, opts) => env.gateway.call(method, rpcParams, opts)"
                    jobId:
                      ref: cronId
                    afterTs:
                      ref: cronRunStartedAt
                    timeoutMs:
                      expr: liveTurnTimeoutMs(env, 180000)
              - assert:
                  expr: "finishedRun.status === 'ok'"
                  message:
                    expr: "`rings cron finished with ${finishedRun.status ?? 'unknown'}: ${JSON.stringify(finishedRun)}`"
              - call: waitForCondition
                saveAs: promoted
                args:
                  - lambda:
                      async: true
                      expr: "(async () => { const status = await readDoctorMemoryStatus(env); const lightReport = await fs.readFile(lightReportPath, 'utf8').catch(() => ''); const remReport = await fs.readFile(remReportPath, 'utf8').catch(() => ''); const promotedMemory = await fs.readFile(memoryPath, 'utf8').catch(() => ''); const promotedEntry = status.rings?.promotedEntries?.find((entry) => entry.snippet?.includes(config.expectedNeedle)); const promotionMarker = promotedEntry?.key ? `<!-- branch-memory-promotion:${promotedEntry.key} -->` : ''; if (!lightReport.includes('# Light Sleep')) return undefined; if (!remReport.includes('# REM Sleep')) return undefined; if (!promotedMemory.includes(config.expectedNeedle)) return undefined; if (!promotionMarker || !promotedMemory.includes(promotionMarker)) return undefined; if (status.rings?.phases?.deep?.managedCronPresent !== true) return undefined; if ((status.rings?.promotedTotal ?? 0) < 1) return undefined; return { status, lightReport, remReport, promotedMemory, promotionMarker }; })()"
                  - expr: liveTurnTimeoutMs(env, 180000)
                  - 1000
            finally:
              - call: patchConfig
                saveAs: restoreResult
                args:
                  - env:
                      ref: env
                    patch:
                      plugins:
                        entries:
                          memory-core:
                            config:
                              rings:
                                expr: "ringsOriginal === undefined ? null : structuredClone(ringsOriginal)"
              - call: waitForGatewayHealthy
                args:
                  - ref: env
              - call: waitForQaChannelReady
                args:
                  - ref: env
                  - 60000
      detailsExpr: "JSON.stringify({ promotedTotal: promoted.status.rings?.promotedTotal ?? 0, shortTermCount: promoted.status.rings?.shortTermCount ?? 0, phaseSignalCount: promoted.status.rings?.phaseSignalCount ?? 0, lightSleep: promoted.lightReport.includes('# Light Sleep'), remSleep: promoted.remReport.includes('# REM Sleep'), promotionMarkerPresent: promoted.promotedMemory.includes(promoted.promotionMarker), recallEvidence, cronRun: { id: cronId, status: finishedRun.status, ts: finishedRun.ts } })"

    - name: reports restored configuration and runtime readiness
      actions:
        - call: readConfigSnapshot
          saveAs: restored
          args:
            - ref: env
        - call: fetchJson
          saveAs: readyz
          args:
            - expr: "`${env.gateway.baseUrl}/readyz`"
        - call: env.gateway.call
          saveAs: restoredChannels
          args:
            - channels.status
            - probe: false
              timeoutMs: 10000
            - timeoutMs: 15000
      detailsExpr: >-
        JSON.stringify({ ringsBefore: ringsOriginal ?? null,
          ringsAfter: restored.config.plugins?.entries?.['memory-core']?.config?.rings ?? null,
          restoreReceipt: { ok: restoreResult?.ok ?? null, noop: restoreResult?.noop ?? false,
            restarted: restoreResult?.restarted ?? false }, readyz,
          channels: Object.fromEntries(Object.entries(restoredChannels.channelAccounts ?? {}).map(
            ([channel, accounts]) => [channel, accounts.map(({ accountId, running, connected,
              lifecycle, restartPending }) => ({ accountId, running, connected, lifecycle, restartPending }))])) })
