title: "Runtime tool fixture — bash"

scenario:
  id: runtime-tool-bash
  surface: runtime-tools
  runtimePairLane: core
  coverage:
    secondary:
      - tools.exec-routing-bash
  objective: Verify shell command behavior is tracked across Branch Agent and Codex while Codex owns exec/process natively.
  successCriteria:
    - Branch Agent may expose Branch Agent exec while Codex app-server mode may omit duplicate Branch Agent dynamic exec/process.
    - Codex executes the happy and failure paths through its native command tool and projects correlated bash receipts.
    - The fixture validates the successful output marker and the failed command result.
  docsRefs:
    - qa/scenarios/index.yaml
  codeRefs:
    - src/agents/agent-tools.ts
    - src/agents/bash-tools.schemas.ts
    - extensions/qa-lab/src/native-workspace-behavior.ts
    - extensions/qa-lab/src/runtime-tool-fixture.ts
  execution:
    kind: flow
    summary: Exercise the bash family through the Branch Agent exec tool.
    config:
      toolName: exec
      nativeWorkspaceBehavior: bash
      toolCoverage:
        family: bash
        actualTool: exec
        bucket: codex-native-workspace
        expectedLayer: codex-native-workspace
        required: true
        tracking: "#80319"
        codexDefaultImpact: P4
        qaImpact: P1
        action: execute native command behavior separately from Branch Agent dynamic tool parity
        reason: Codex app-server intentionally owns command execution natively; the fixture must not require Branch Agent dynamic exec exposure.
      promptSnippet: "target=exec"
      failurePromptSnippet: "failure target=exec"

flow:
  steps:
    - name: exercises bash happy and failure paths
      actions:
        - call: runRuntimeToolFixture
          saveAs: result
          args:
            - ref: env
            - ref: config
      detailsExpr: result
