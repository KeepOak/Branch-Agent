<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seedbank · Branch Agent plugins</title>
<style>body{font:16px system-ui;max-width:900px;margin:3rem auto;padding:0 1rem;background:#10221b;color:#edf5ef}a{color:#a4e5b6}article{padding:1.5rem;margin:1rem 0;border:1px solid #42634e;border-radius:12px}input{font:inherit;width:95%;padding:1rem}code{display:block;overflow:auto;margin:1rem 0}small{color:#bdccc1;overflow-wrap:anywhere}#status{overflow-wrap:anywhere}*{box-sizing:border-box}article{min-width:0}</style>
<h1>Seedbank</h1><p>Branch Agent plugins. Free public npm packages with identical GitHub Releases tarball backups.</p>
<label>Find a plugin <input id="filter" type="search" placeholder="Search by name or description"></label>
<p id="status"></p><main id="plugins"></main>
<script id="catalog" type="application/json">__SEEDBANK_CATALOG__</script>
<script>
const catalog = JSON.parse(document.getElementById('catalog').textContent);
const container = document.getElementById('plugins');
// Plain words for what a pack can reach. Skills never reach anything (they are instructions only).
function permissionSentence(p) {
  const x = p.permissions;
  if (!x) return 'Permissions not declared.';
  const reach = [x.network && 'the network', x.files !== 'none' && 'your files', x.runCommands && 'run commands', x.secrets && 'your secrets', x.computerControl && 'control your computer'].filter(Boolean);
  return reach.length ? `Can reach: ${reach.join(', ')}.` : 'Reaches nothing outside Branch Agent.';
}
function render() {
  const query = document.getElementById('filter').value.toLowerCase();
  container.replaceChildren();
  const entries = catalog.packages.filter(p => `${p.name} ${p.description}`.toLowerCase().includes(query));
  document.getElementById('status').textContent = `${entries.length} plugins · source ${catalog.sourceSha}`;
  for (const p of entries) {
    const article = document.createElement('article');
    const kind = p.kind === 'skill' ? 'skill' : 'plugin';
    const lines = [['h2',p.name],['small',`${kind} · ${p.tier}`],['p',p.description],['p',permissionSentence(p)],['code',`node scripts/seedbank-install.mjs seedbank.json ${p.seedbankSpec} --force`],['small',`SHA-256: ${p.sha256}`]];
    if (kind === 'plugin') lines.splice(4, 0, ['code',`branch plugins install ${p.npmSpec} --force`]);
    for (const [tag, text] of lines) {
      const element = document.createElement(tag); element.textContent = text; article.append(element);
    }
    const a = document.createElement('a'); a.href = p.tarball; a.textContent = 'Download identical release tarball'; a.rel = 'noopener'; article.append(document.createElement('br'),a);
    container.append(article);
  }
}
document.getElementById('filter').addEventListener('input',render);render();
</script>
</html>
