name: Merge gate

# Runs on every pull request. The other workflows only start when their paths change, so none of them
# can be a required check on its own. This job waits for whichever of them started on the PR's head
# commit and fails if any of them failed. `main` requires only this check.
on:
  pull_request:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine what needs to run based on changed files
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Check out the PR merge commit and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Determine what changed
        id: filter
        run: |
          set -euo pipefail
          # Get list of changed files
          changed_files=$(git diff --name-only HEAD^1 HEAD)
          
          # Check if only docs/markdown changed
          docs_only=false
          if echo "$changed_files" | grep -qvE '\.(md|txt|rst)$|^docs/|^README|^LICENSE|^CONTRIBUTING'; then
            docs_only=false
          else
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Fast test coverage check - runs in parallel
  changed-test-coverage:
    needs: filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR merge commit and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up reviewed Node with cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json
      - name: Test the coverage check
        run: node --test scripts/changed-test-coverage.test.mjs
      - name: Require every changed test to run in CI
        run: node scripts/changed-test-coverage.mjs
      - name: Check merge command patterns in documentation
        run: node scripts/check-merge-command.mjs

  # Poll for other PR checks - runs in parallel with cache
  wait-for-checks:
    needs: filter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the PR's other checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_ONLY: ${{ needs.filter.outputs.docs_only }}
        run: |
          set -euo pipefail
          # For docs-only changes, we can wait less time
          if [ "$DOCS_ONLY" = "true" ]; then
            max_attempts=60
            initial_sleep=10
          else
            max_attempts=85
            initial_sleep=30
          fi
          
          # Give path-filtered workflows time to register their runs.
          sleep "$initial_sleep"
          
          for attempt in $(seq 1 "$max_attempts"); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "merge-gate" and .name != "wait-for-checks" and .name != "changed-test-coverage" and .name != "filter")]')
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not)) | "\(.name): \(.conclusion)"] | .[]' <<<"$runs")
            if [ -n "$failed" ]; then
              echo "Failed checks:"; echo "$failed"; exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All $(jq length <<<"$runs") other checks passed."; exit 0
            fi
            echo "Waiting for $pending check(s)…"
            sleep 10
          done
          echo "Timed out waiting for checks."; exit 1

  # Final gate - this is the required check
  merge-gate:
    needs: [filter, changed-test-coverage, wait-for-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check all gates passed
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          COVERAGE_RESULT: ${{ needs.changed-test-coverage.result }}
          WAIT_RESULT: ${{ needs.wait-for-checks.result }}
        run: |
          echo "Filter: $FILTER_RESULT"
          echo "Coverage: $COVERAGE_RESULT"
          echo "Wait: $WAIT_RESULT"
          
          # Filter must always succeed
          test "$FILTER_RESULT" = "success"
          
          # Coverage must succeed
          test "$COVERAGE_RESULT" = "success"
          
          # Wait must succeed
          test "$WAIT_RESULT" = "success"
          
          echo "All gates passed!"
