name: Merge gate

# Runs on every pull request. The other workflows only start when their paths change, so none of them
# can be a required check on its own. This job waits for whichever of them started on the PR's head
# commit and fails if any of them failed. `main` requires only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  # Body edits keep the same SHA; do not cancel the wait already running for this PR.
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  changed-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR merge commit and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test the coverage check
        run: node --test scripts/changed-test-coverage.test.mjs
      - name: Test the trusted merge-gate helper
        run: node --test scripts/merge-gate-trusted.test.mjs
      - name: Require every changed test to run in CI
        run: node scripts/changed-test-coverage.mjs
      - name: Check merge command patterns in documentation
        run: node scripts/check-merge-command.mjs
      - name: Guard COPIED.csv and harvest lists
        run: |
          node --test scripts/check-copied-csv.test.mjs scripts/feature-batch-ci-shard.test.mjs
          node scripts/check-copied-csv.mjs
      - name: Test UI screenshot proof check
        run: node --test scripts/check-ui-proof.test.mjs scripts/check-proof-images.test.mjs
      - name: Require screenshots for window UI changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-ui-proof.mjs

  merge-gate:
    needs: changed-test-coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require changed test coverage
        env:
          COVERAGE_RESULT: ${{ needs.changed-test-coverage.result }}
        run: test "$COVERAGE_RESULT" = success
      - name: Wait for the PR's other checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Give path-filtered workflows time to register their runs.
          sleep 30
          for attempt in $(seq 1 64); do
            # Read every check-run page. One response is capped at 100.
            page=1
            pages='[]'
            while :; do
              page_json=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100&page=$page")
              pages=$(jq -s '.[0] + [.[1]]' <<<"$pages"$'\n'"$page_json")
              collected=$(jq '[.[].check_runs[]] | length' <<<"$pages")
              total=$(jq '.[-1].total_count // 0' <<<"$pages")
              if [ "$collected" -ge "$total" ]; then break; fi
              page=$((page + 1))
            done
            combined=$(jq '{check_runs: [.[].check_runs[]]}' <<<"$pages")
            runs=$(jq '[.check_runs[] | select(.name != "merge-gate" and .name != "merge-gate-trusted")]' <<<"$combined")
            # Skip Visual tour's continue-on-error `comment` job only when
            # check-suite or workflow-run attribution proves visual-tour.yml.
            # A `comment` check from any other workflow is still waited on.
            comment_paths='{}'
            while IFS= read -r check; do
              [ -z "$check" ] && continue
              id=$(jq -r '.id' <<<"$check")
              path=""
              run_id=$(jq -r '(.details_url // .html_url // "") | capture("/actions/runs/(?<id>[0-9]+)")? | .id // empty' <<<"$check")
              if [ -n "$run_id" ]; then
                path=$(gh api "repos/$REPO/actions/runs/$run_id" | jq -r '.path // empty') || path=""
              else
                suite=$(jq -r '.check_suite.id // empty' <<<"$check")
                if [ -n "$suite" ]; then
                  path=$(gh api "repos/$REPO/actions/runs?check_suite_id=$suite&per_page=1" | jq -r '.workflow_runs[0].path // empty') || path=""
                fi
              fi
              comment_paths=$(jq --arg id "$id" --arg path "$path" '. + {($id): $path}' <<<"$comment_paths")
            done < <(jq -c '.[] | select(.name == "comment")' <<<"$runs")
            runs=$(jq --argjson paths "$comment_paths" --arg tour '.github/workflows/visual-tour.yml' '
              map(select(.name != "comment" or (($paths[.id | tostring] // "") != $tour)))
            ' <<<"$runs")
            # CodeQL default setup can register Analyze after all other checks finish.
            pending=$(jq '([.[] | select(.status != "completed")] | length) + (if any(.[]; .name == "Analyze (actions)") then 0 else 1 end)' <<<"$runs")
            failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not)) | "\(.name): \(.conclusion)"] | .[]' <<<"$runs")
            if [ -n "$failed" ]; then
              echo "Failed checks:"; echo "$failed"; exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All $(jq length <<<"$runs") other checks passed."; exit 0
            fi
            echo "Waiting for $pending check(s)…"
            if [ "$attempt" -lt 64 ]; then sleep 30; fi
          done
          pending_names=$(jq -r '[.[] | select(.status != "completed") | .name] + (if any(.[]; .name == "Analyze (actions)") then [] else ["Analyze (actions)"] end) | unique | sort | join(", ")' <<<"$runs")
          echo "Timed out waiting for: $pending_names"
          echo "re-run merge-gate, do not merge main"
          exit 1
