name: Merge gate

# Runs on every pull request. The other workflows only start when their paths change, so none of them
# can be a required check on its own. This job waits for whichever of them started on the PR's head
# commit and fails if any of them failed. `main` requires only this check.
on:
  pull_request:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR merge commit and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test the coverage check
        run: node --test scripts/changed-test-coverage.test.mjs
      - name: Require every changed test to run in CI
        run: node scripts/changed-test-coverage.mjs
      - name: Check merge command patterns in documentation
        run: node scripts/check-merge-command.mjs
      - name: Test merge-gate wait filter and timeout message
        run: node --test scripts/merge-gate-wait.test.mjs

  wait-for-checks:
    runs-on: ubuntu-latest
    # Check jobs stay under 15 minutes. This waiter is the documented exception.
    # 60 minutes is longer than today's queue plus the slowest required check
    # (visual-tour build+tour, feature shards). The loop is ~58 minutes so the
    # named timeout can print. See scripts/merge-gate-wait.mjs.
    timeout-minutes: 60
    steps:
      - name: Check out wait logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Wait for the PR's other checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Give path-filtered workflows time to register their runs.
          sleep 30
          for attempt in $(seq 1 345); do
            set +e
            decision=$(node scripts/merge-gate-wait.mjs fetch-evaluate)
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "All $(sed -n '2p' <<<"$decision") other checks passed."; exit 0
            fi
            if [ "$status" -eq 2 ]; then
              echo "Failed checks:"; tail -n +2 <<<"$decision"; exit 1
            fi
            if [ "$status" -ne 3 ]; then
              echo "$decision"; exit 1
            fi
            echo "Waiting for $(sed -n '2p' <<<"$decision") check(s): $(tail -n +3 <<<"$decision" | paste -sd ', ' -)"
            sleep 10
          done
          node scripts/merge-gate-wait.mjs timeout

  merge-gate:
    needs: [changed-test-coverage, wait-for-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require changed test coverage
        env:
          COVERAGE_RESULT: ${{ needs.changed-test-coverage.result }}
        run: test "$COVERAGE_RESULT" = success
      - name: Require the PR's other checks
        env:
          WAIT_RESULT: ${{ needs.wait-for-checks.result }}
        run: test "$WAIT_RESULT" = success
