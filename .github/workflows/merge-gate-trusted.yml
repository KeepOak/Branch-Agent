name: Merge gate trusted

# Runs from the default branch via pull_request_target. A pull request cannot change this
# workflow, check out its own tree, or execute its own files. Permissions stay read-only.
# Scripts and tests always load from current main, never the PR's recorded base SHA or head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

concurrency:
  # Head SHA is in the group so a new commit starts its own run. `edited` (title/body)
  # keeps the same SHA, so cancel-in-progress is off for that action and cannot abort
  # the wait already running for this SHA.
  group: merge-gate-trusted-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  # Own job, so its rate-limit waits never share the 35-minute trusted job (AGENTS.md rule 13: 15-minute cap).
  # Exit 2 from the checker is "not checked: rate limited, re-run". The step maps that to 0 so preflight
  # still runs here. The named commit-emails job then fails red (Actions has no job-level pending).
  commit-emails-run:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      exit_code: ${{ steps.emails.outputs.exit_code }}
    steps:
      - name: Check out the default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Final head needs main's recent history, not only the tip commit.
          fetch-depth: 2000
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test the commit email checker
        run: node --test scripts/check-commit-emails.test.mjs
      - name: Check pull request commit emails
        id: emails
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GATE_WAIT_SECONDS: '600'
        run: |
          set +e
          node scripts/check-commit-emails.mjs
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "not checked: rate limited, re-run"
            exit 0
          fi
          exit "$code"

      - name: Fetch pull request history for the Final head check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)" fetch --no-tags --no-recurse-submodules --depth=2000 origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Preflight the pull request body, commits and files with the local checks
        # The body is read live from the API, never from the event payload. All of its API calls share one
        # 120 s budget, and this 15-minute job bounds the step. Depends on #1000 (the script is on main only then).
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PREFLIGHT_WAIT_SECONDS: '120'
        run: node scripts/pr-preflight.mjs --ci
  # Named check merge-gate sees. Always runs unless the runner was cancelled, and requires the
  # runner to have succeeded, so a later preflight failure cannot hide behind a skipped job.
  # Exit 2 fails this job red with "not checked: rate limited, re-run".
  commit-emails:
    needs: commit-emails-run
    if: always() && needs.commit-emails-run.result != 'cancelled'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reflect the commit-email verdict
        run: |
          set -euo pipefail
          if [ "${{ needs.commit-emails-run.outputs.exit_code }}" = "2" ]; then
            echo "not checked: rate limited, re-run"
          fi
          test "${{ needs.commit-emails-run.result }}" = "success"
          test "${{ needs.commit-emails-run.outputs.exit_code }}" = "0"
  merge-gate-trusted:
    permissions:
      contents: read
      checks: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test the trusted gate helper
        run: node --test scripts/merge-gate-trusted.test.mjs
      - name: Test the rate-limit wait helper
        run: node --test scripts/merge-gate-rate-limit.test.mjs scripts/check-gate-files-fresh.test.mjs
      - name: Read the core API budget before this job
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_LABEL: merge-gate-trusted
        run: node scripts/github-api-budget.mjs before
      - name: Wait for checks and run main's coverage and merge-command gates
        env:
          GH_TOKEN: ${{ github.token }}
          # One evaluation, no poll loop: a pending result fails the run, and merge-gate-recheck reruns it
          # when the checks it waits for finish.
          MERGE_GATE_WAIT_SECONDS: '0'
          # Rate-limit waits for the job's API calls (separate from the zero poll budget above). A rate limit
          # waits here, then fails closed when this budget runs out.
          MERGE_GATE_API_WAIT_SECONDS: '600'
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/merge-gate-trusted.mjs
      - name: Log the core API budget this job used
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_LABEL: merge-gate-trusted
        run: node scripts/github-api-budget.mjs after
