name: Release freshness

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/release-freshness*.mjs'
      - '.github/workflows/release-freshness.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: release-freshness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'KeepOak/Branch-Agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test the release-freshness decision
        run: node --test scripts/release-freshness.test.mjs
      - name: Fail when main HEAD has no published release after 90 minutes
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/release-freshness.mjs
