name: App Verification Demo

on:
  pull_request:
    paths:
      - 'scripts/verify-in-app*'
      - 'scripts/feature-map*'
      - 'docs/feature-map.json'
      - '.cursor/skills/verify-in-app/**'
      - '.github/workflows/app-verification-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - run: npm install --global pnpm@12.5.1
      
      # Build engine and window (same as visual-tour)
      - run: pnpm install --frozen-lockfile && node --import ./scripts/tsx.mjs scripts/build-all.mts ciBuildSeed
        working-directory: engine
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: window
      
      # Install Playwright
      - run: pnpm -C engine exec playwright install chromium
      
      # Launch and screenshot (reusing visual-tour's launch pattern)
      - name: Launch app and capture screenshots
        env:
          BRANCH_HOME: ${{ runner.temp }}/verify-home
          BRANCH_SKIP_CHANNELS: "1"
          BRANCH_GATEWAY_TOKEN: ${{ runner.temp }}/gateway-token
          VISUAL_GATEWAY_PORT: "19651"
          VISUAL_WINDOW_PORT: "5651"
          VISUAL_OUT: ${{ runner.temp }}/verification-shots
          VISUAL_TOKEN_FILE: ${{ runner.temp }}/verify-token
        run: |
          set -euo pipefail
          
          # Generate token
          TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$TOKEN" > "$VISUAL_TOKEN_FILE"
          chmod 600 "$VISUAL_TOKEN_FILE"
          export BRANCH_GATEWAY_TOKEN="$TOKEN"
          
          # Create directories
          mkdir -p "$BRANCH_HOME" "$VISUAL_OUT"
          
          # Start services in background
          (cd engine && node branch.mjs gateway --dev --port "$VISUAL_GATEWAY_PORT") > "$RUNNER_TEMP/gateway.log" 2>&1 & gateway_pid=$!
          pnpm -C window exec vite preview --host 127.0.0.1 --port "$VISUAL_WINDOW_PORT" --strictPort > "$RUNNER_TEMP/window.log" 2>&1 & window_pid=$!
          
          # Cleanup on exit
          trap 'kill "$gateway_pid" "$window_pid" 2>/dev/null || true' EXIT
          
          # Wait for services to be ready
          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:$VISUAL_GATEWAY_PORT/readyz" >/dev/null && curl -fsS "http://127.0.0.1:$VISUAL_WINDOW_PORT/" >/dev/null; then
              echo "✅ Services ready"
              break
            fi
            sleep 2
          done
          
          # Seed the gateway with test data
          node scripts/visual-tour/seed.mjs
          
          # Capture screenshots using the verification script
          echo "📸 Capturing Overview..."
          node scripts/verify-in-app-screenshot.mjs Overview
          
          echo "📸 Capturing Canopy..."
          node scripts/verify-in-app-screenshot.mjs Canopy
          
          echo "📸 Capturing Settings › Usage..."
          node scripts/verify-in-app-screenshot.mjs "Settings › Usage"
          
          echo "✅ All screenshots captured"
          ls -lh "$VISUAL_OUT"
      
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-screenshots
          path: ${{ runner.temp }}/verification-shots/
          retention-days: 7
