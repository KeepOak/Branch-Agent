name: Engine handoff checks

# P45: an in-place engine handoff between two real, built engines (engine/test/gateway-desktop-handoff.e2e.test.ts).
# It builds the engine once and runs only that test, in its own job, so it never pushes the named-test shards past
# their time cap.
on:
  pull_request:
    paths:
      - 'engine/src/cli/gateway-cli/**'
      - 'engine/src/process/session-handoff-*'
      - 'engine/src/process/command-queue.ts'
      - 'engine/src/gateway/server-lifecycle*'
      - 'engine/src/gateway/server/http-listen.ts'
      - 'engine/src/gateway/session-handoff-*'
      - 'engine/src/infra/gateway-lock*'
      - 'engine/src/infra/standby-port-placeholder*'
      - 'engine/test/gateway-desktop-handoff.e2e.test.ts'
      - 'engine/test/helpers/desktop-handoff-harness.ts'
      - 'engine/test/helpers/handoff-model-provider.ts'
      - 'engine/test/vitest/vitest.desktop-handoff.config.ts'
      - '.github/workflows/engine-handoff-checks.yml'
  push:
    branches: [main]
    paths:
      - 'engine/src/cli/gateway-cli/**'
      - 'engine/src/process/session-handoff-*'
      - 'engine/src/gateway/server-lifecycle*'
      - 'engine/test/gateway-desktop-handoff.e2e.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-handoff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  handoff:
    name: Real-engine handoff on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: engine
    env:
      CI: 'true'
      # Engines take a while to start on hosted runners; each step logs, but leave the watchdog room.
      BRANCH_VITEST_NO_OUTPUT_TIMEOUT_MS: '600000'
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.5.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the engine the test spawns
        run: node scripts/run-node.mjs --help > /dev/null
      - name: Run the real-engine handoff test
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.desktop-handoff.config.ts
