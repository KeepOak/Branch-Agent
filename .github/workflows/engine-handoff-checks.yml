name: Engine handoff checks

# P45: an in-place engine handoff between two real, built engines (engine/test/gateway-desktop-handoff.e2e.test.ts).
# Each job builds once and runs only its named real-engine cases, below the 15-minute CI job cap.
on:
  pull_request:
    paths:
      - 'engine/src/agents/main-session-recovery/**'
      - 'engine/src/cli/gateway-cli/**'
      - 'engine/src/cli/run-main.ts'
      - 'engine/src/cron/store/receipt-authority-owner*'
      - 'engine/src/process/session-handoff-*'
      - 'engine/src/process/command-queue.ts'
      - 'engine/src/gateway/server-lifecycle*'
      - 'engine/src/gateway/server-startup-session-migration.ts'
      - 'engine/src/gateway/server-cron*'
      - 'engine/src/gateway/server-handoff-error.ts'
      - 'engine/src/gateway/server/handoff-configured-port.ts'
      - 'engine/src/gateway/server/http-listen.ts'
      - 'engine/src/gateway/server-runtime-state.ts'
      - 'engine/src/gateway/session-handoff-*'
      - 'engine/src/infra/gateway-lock*'
      - 'engine/src/infra/standby-port-placeholder*'
      - 'engine/test/gateway-desktop-handoff.e2e.test.ts'
      - 'engine/test/helpers/desktop-handoff-harness.ts'
      - 'engine/test/helpers/handoff-channel-plugin.ts'
      - 'engine/test/helpers/handoff-model-provider.ts'
      - 'engine/test/vitest/vitest.desktop-handoff.config.ts'
      - 'desktop/src/main.ts'
      - 'desktop/src/gateway.ts'
      - 'desktop/src/handoff-timeouts.json'
      - 'desktop/scripts/restart-engine.test.mjs'
      - '.github/workflows/engine-handoff-checks.yml'
  push:
    branches: [main]
    paths:
      - 'engine/src/agents/main-session-recovery/**'
      - 'engine/src/cli/gateway-cli/**'
      - 'engine/src/cli/run-main.ts'
      - 'engine/src/cron/store/receipt-authority-owner*'
      - 'engine/src/process/session-handoff-*'
      - 'engine/src/process/command-queue.ts'
      - 'engine/src/gateway/server-lifecycle*'
      - 'engine/src/gateway/server-startup-session-migration.ts'
      - 'engine/src/gateway/server-cron*'
      - 'engine/src/gateway/server-handoff-error.ts'
      - 'engine/src/gateway/server/handoff-configured-port.ts'
      - 'engine/src/gateway/server/http-listen.ts'
      - 'engine/src/gateway/server-runtime-state.ts'
      - 'engine/src/gateway/session-handoff-*'
      - 'engine/src/infra/gateway-lock*'
      - 'engine/src/infra/standby-port-placeholder*'
      - 'engine/test/gateway-desktop-handoff.e2e.test.ts'
      - 'engine/test/helpers/desktop-handoff-harness.ts'
      - 'engine/test/helpers/handoff-channel-plugin.ts'
      - 'engine/test/helpers/handoff-model-provider.ts'
      - 'engine/test/vitest/vitest.desktop-handoff.config.ts'
      - 'desktop/src/main.ts'
      - 'desktop/src/gateway.ts'
      - 'desktop/src/handoff-timeouts.json'
      - 'desktop/scripts/restart-engine.test.mjs'
      - '.github/workflows/engine-handoff-checks.yml'
  workflow_dispatch:
    inputs:
      windows_regressions_only:
        description: Run the Windows lease-gate and held-drain lanes only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Independent manual proof runs must not replace each other's pending run.
  group: engine-handoff-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  handoff:
    name: Real-engine handoff ${{ matrix.shard.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.windows_regressions_only && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        shard: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.windows_regressions_only &&
          '[{"name":"held-drain","pattern":"keeps A alive on drain-stop"},
          {"name":"lease-gate","pattern":"makes a session RPC"}]' ||
          '[{"name":"turn-order","pattern":"hands the state to the standby"},
          {"name":"same-session","pattern":"queues B''s turn on S"},
          {"name":"held-drain","pattern":"keeps A alive on drain-stop"},
          {"name":"rollback-before","pattern":"rolls back before the standby"},
          {"name":"channel-and-cron","pattern":"starts the successor channel"},
          {"name":"desktop-before","pattern":"takes the state back when the desktop"},
          {"name":"rollback-after","pattern":"does not roll the old engine"},
          {"name":"desktop-after","pattern":"finishes and stops the old engine"},
          {"name":"lease-gate","pattern":"makes a session RPC"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: engine
    env:
      CI: 'true'
      # Engines take a while to start on hosted runners; each step logs, but leave the watchdog room.
      BRANCH_VITEST_NO_OUTPUT_TIMEOUT_MS: '600000'
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.5.1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the engine the test spawns
        run: node scripts/run-node.mjs --help > /dev/null
      - name: Run the real-engine handoff test
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.desktop-handoff.config.ts -t "${{ matrix.shard.pattern }}"
