name: Capability feature checks

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-batch-ci*'
      - 'scripts/feature-batch-ci-window-tooling/**'
      - 'scripts/feature-batch-ci-named/**'
      - '.github/workflows/feature-capability-checks.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-batch-ci*'
      - 'scripts/feature-batch-ci-window-tooling/**'
      - 'scripts/feature-batch-ci-named/**'
      - '.github/workflows/feature-capability-checks.yml'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-capabilities-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feature-capabilities:
    name: Capability tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # PRs run Linux and Windows. macOS runs on main after merge, nightly, and on PRs that touch
        # OS-specific code (os-specific-checks.yml). macOS runners have the lowest concurrency limit.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest", "ubuntu-latest"]' || '["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    env:
      CI: 'true'
    steps:
      - name: Check out the feature commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
            ~/Library/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'scripts/feature-batch-ci-window-tooling/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Verify pins, install frozen dependencies, and run capability tests
        run: node scripts/feature-batch-ci.mjs capabilities
