name: Engine build (PR)

on:
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/engine-build-pr.yml'

permissions:
  contents: read

env:
  BRANCH_BUILD_TIMESTAMP: ${{ github.event.pull_request.updated_at }}

concurrency:
  group: engine-build-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Cache pnpm store
        uses: actions/cache@5a0d8e91002c27b2e2b5224a33b841a8eb5c2d12 # v5
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
            ~/Library/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('engine/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: engine
      - run: node --import ./scripts/tsx.mjs scripts/build-all.mts ciBuildSeed
        working-directory: engine
      - name: Pack compiler seed
        run: |
          find engine/packages -type d -name dist -prune > "$RUNNER_TEMP/package-dist-dirs.txt"
          tar -cf engine-seed.tar engine/.artifacts/build-all-cache engine/dist -T "$RUNNER_TEMP/package-dist-dirs.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-seed
          path: engine-seed.tar
          retention-days: 3

  declarations:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [branch-dts-base, branch-dts-extensions-1, branch-dts-extensions-2, branch-dts-extensions-3, branch-dts-extensions-4, branch-dts-extensions-5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Cache pnpm store
        uses: actions/cache@5a0d8e91002c27b2e2b5224a33b841a8eb5c2d12 # v5
        with:
          path: |
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('engine/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: engine
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: engine-seed
      - run: tar -xf engine-seed.tar
      # Asset hooks create source-side manifests and bundles that declaration
      # signatures also see during the final full build.
      - run: pnpm plugins:assets:build
        working-directory: engine
      - run: node --import ./scripts/tsx.mjs scripts/ci-seed-unified-declaration.ts '${{ matrix.group }}'
        working-directory: engine
      - name: Pack declaration cache
        run: tar -cf "${{ matrix.group }}.tar" "engine/.artifacts/build-all-cache/tsdown-unified-${{ matrix.group }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-${{ matrix.group }}
          path: ${{ matrix.group }}.tar
          retention-days: 3

  build:
    needs: declarations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Cache pnpm store
        uses: actions/cache@5a0d8e91002c27b2e2b5224a33b841a8eb5c2d12 # v5
        with:
          path: |
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('engine/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: engine
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: engine-seed
      - run: tar -xf engine-seed.tar
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: engine-branch-dts-*
          path: declaration-caches
      - run: for archive in declaration-caches/*/*.tar; do tar -xf "$archive"; done
      - run: pnpm build
        working-directory: engine
        env:
          BRANCH_CI_PREBUILT_UNIFIED_DTS: '1'
