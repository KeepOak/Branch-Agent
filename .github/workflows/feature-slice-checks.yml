name: Feature slice checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-slice-ci*.mjs'
      - 'scripts/feature-batch-ci-runtime.mjs'
      - '.github/workflows/feature-slice-checks.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-slice-ci*.mjs'
      - 'scripts/feature-batch-ci-runtime.mjs'
      - '.github/workflows/feature-slice-checks.yml'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-slices-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  feature-slices:
    name: Exact feature slices on ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # PRs run Linux and Windows. macOS runs on main after merge, nightly, and on PRs that touch
        # OS-specific code (os-specific-checks.yml). macOS runners have the lowest concurrency limit.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest", "ubuntu-latest"]' || '["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    env:
      CI: 'true'
      NODE_OPTIONS: '--max-old-space-size=1024'
      GOMEMLIMIT: '2GiB'
      GOMAXPROCS: '2'
    steps:
      - name: Check out the exact feature commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Validate exact inventory and coverage classification
        run: node scripts/feature-slice-ci.mjs validate
      - name: Run present source slices with frozen dependencies and strict source profiles
        run: node scripts/feature-slice-ci.mjs all
      - name: Retain exact source inventory, results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feature-slice-proof-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/branch-feature-slice-*/*.json
            ${{ runner.temp }}/branch-feature-slice-*/*.log
          if-no-files-found: error
          retention-days: 7
