name: Desktop checks

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'engine/scripts/lib/available-memory.*'
      - '.github/workflows/desktop-checks.yml'
      - '.github/workflows/source-build.yml'
      - '.github/workflows/component-release.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'engine/scripts/lib/available-memory.*'
      - '.github/workflows/desktop-checks.yml'
      - '.github/workflows/source-build.yml'
      - '.github/workflows/component-release.yml'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Build strict desktop sources
        env:
          NODE_OPTIONS: '--max-old-space-size=256'
        run: npm run build
      - name: Check available memory
        env:
          BRANCH_DESKTOP_TEST_DIST: ${{ github.workspace }}/desktop/dist
        run: node --test scripts/available-memory.test.mjs
      - name: Check component release readiness
        run: node --test scripts/component-release-readiness.test.mjs
      - name: Check release publication order and public latest retries
        run: node --test scripts/publish-component-release.test.mjs
      - name: Check the installer builder and its signing hooks
        run: node --test scripts/release-installers.test.mjs scripts/release-signing.test.mjs
      - name: Check the one-line install scripts against a fixture release
        run: node --test scripts/install-scripts.test.mjs
      - name: Lint install.sh with shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install/install.sh
      - name: Lint install.ps1 with PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        # PSScriptAnalyzer 1.23.0 pinned by digest (the PowerShell Gallery's own SHA-512 packageHash for that version,
        # plus the SHA-256 of the same .nupkg). Checked before it is unpacked or imported.
        env:
          PSA_SHA256: b9969345f78251112fb75bdddc789be8689a343472a2e09762303aa03287afab
        run: |
          $nupkg = Join-Path $env:RUNNER_TEMP 'psscriptanalyzer.1.23.0.nupkg'
          Invoke-WebRequest -Uri 'https://cdn.powershellgallery.com/packages/psscriptanalyzer.1.23.0.nupkg' -OutFile $nupkg
          $actual = (Get-FileHash -Algorithm SHA256 -Path $nupkg).Hash.ToLowerInvariant()
          if ($actual -ne $env:PSA_SHA256) { throw "PSScriptAnalyzer download does not match its pinned digest ($actual). Nothing was imported." }
          $module = Join-Path $env:RUNNER_TEMP 'PSScriptAnalyzer'
          Expand-Archive -Path $nupkg -DestinationPath $module -Force
          Import-Module (Join-Path $module 'PSScriptAnalyzer.psd1') -Force
          $issues = @(Invoke-ScriptAnalyzer -Path install/install.ps1 -Severity Warning,Error)
          $issues | Format-Table -AutoSize | Out-String | Write-Output
          if ($issues.Count -gt 0) { exit 1 }
      - name: Check updates, startup and owned process cleanup
        env:
          BRANCH_DESKTOP_TEST_DIST: ${{ github.workspace }}/desktop/dist
          NODE_OPTIONS: '--max-old-space-size=96'
        run: node --max-old-space-size=96 --test scripts/auto-apply-update.test.mjs scripts/available-memory.test.mjs scripts/component-update-ipc.test.mjs scripts/component-update.test.mjs scripts/desktop-controls.test.mjs scripts/desktop-update.test.mjs scripts/gateway-ready.test.mjs scripts/gateway-supervisor.test.mjs scripts/hidden-processes.test.mjs scripts/mac-computer-driver.test.mjs scripts/profile-migration.test.mjs scripts/resident-window.test.mjs scripts/restart-engine.test.mjs scripts/update-lock.test.mjs scripts/window-state.test.mjs
      - name: Check component release archive scale
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: '--max-old-space-size=256'
        run: node --experimental-test-module-mocks --test desktop/scripts/component-release-large-subtree.test.mjs
      - name: Check the handoff deadlines shared with the engine
        env:
          BRANCH_DESKTOP_TEST_DIST: ${{ github.workspace }}/desktop/dist
        run: node --test scripts/handoff-timeouts.test.mjs
      - name: Check immutable release inventory and bootstrap targets
        env:
          BRANCH_DESKTOP_TEST_DIST: ${{ github.workspace }}/desktop/dist
        run: node --test scripts/brand-icons.test.mjs scripts/linux-launcher.test.mjs scripts/mac-applications.test.mjs scripts/mac-release-signing.test.mjs scripts/release-inventory.test.mjs scripts/production-engine-smoke.test.mjs scripts/release-source-freeze.test.mjs scripts/release-production-layout.test.mjs
      - name: Check the diagnostics log, redaction, problem report and archive
        env:
          BRANCH_DESKTOP_TEST_DIST: ${{ github.workspace }}/desktop/dist
        run: node --test scripts/diagnostics.test.mjs
      - name: Check the desktop log caps and rotation
        env:
          BRANCH_DESKTOP_TEST_DIST: ${{ github.workspace }}/desktop/dist
        run: node --test scripts/log-rotation.test.mjs
      - name: Check documentation merge command patterns
        working-directory: ${{ github.workspace }}
        run: node --test scripts/check-merge-command.test.mjs
  mac-applications:
    name: macOS Applications install
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Build strict desktop sources
        env:
          NODE_OPTIONS: '--max-old-space-size=256'
        run: npm run build
      - name: Install into Applications and check the bundle
        run: node scripts/check-mac-bundle.mjs
