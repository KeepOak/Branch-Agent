name: Engine lint baselines

# merge-gate waits for every check on the PR head. Root workflows never ran
# `pnpm lint` or the Control UI i18n baseline steps, so main could merge with
# a red local `cd engine && pnpm lint`. This job is the smallest required
# check that catches that drift before merge.
on:
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/engine-lint-baselines.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-lint-baselines.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-lint-baselines-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-baselines:
    name: Control UI i18n baselines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.5.1
      - name: Install frozen engine dependencies
        working-directory: engine
        run: pnpm install --frozen-lockfile
      - name: Verify Control UI source catalog and raw-copy baseline
        working-directory: engine
        run: pnpm ui:i18n:verify
        # `generated` / catalog-fallbacks.json is post-merge owned. Requiring it
        # on source PRs forces mixed generated+source commits, which isolation rejects.

  # The generated-baseline check moved out of the named PR suite (control-ui-i18n.test.ts) into
  # its own test file. It runs after merge on main only; the test is not listed in any named PR
  # batch. When it drifts on main, the job regenerates catalog-fallbacks.json and opens a bot PR,
  # so nobody hand-edits that file in a source PR (AGENTS.md rule 6).
  generated-baseline:
    name: Control UI catalog fallbacks (after merge)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Write access is used only by the refresh steps below, and only on main pushes.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          # Kept so the refresh step can push its bot branch with the default GITHUB_TOKEN.
          persist-credentials: true
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.5.1
      - name: Install frozen engine dependencies
        working-directory: engine
        run: pnpm install --frozen-lockfile
      - name: Check catalog-fallbacks.json against the Control UI source
        id: generated
        working-directory: engine
        run: node scripts/run-vitest.mjs run test/scripts/control-ui-i18n.generated.test.ts
      - name: Regenerate catalog-fallbacks.json after drift
        if: ${{ failure() && steps.generated.outcome == 'failure' }}
        working-directory: engine
        # Calls the existing fallback writer directly. `ui:i18n:sync` also translates locales and fails
        # without a provider key, and `ui:i18n:baseline` only refreshes the raw-copy baseline.
        run: |
          node --import ./scripts/tsx.mjs --input-type=module -e "const m = await import('./scripts/control-ui-i18n-verify.ts'); await m.syncControlUiCatalogFallbackBaseline({ checkOnly: false, write: true });"
      - name: Open a refresh PR for the regenerated file
        if: ${{ failure() && steps.generated.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- engine/ui/src/i18n/.i18n/)"
          if [ -z "$changed" ]; then
            echo "Regeneration changed nothing under engine/ui/src/i18n/.i18n/; the drift is elsewhere."
            exit 1
          fi
          branch="bot/catalog-fallbacks-${SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          printf '%s\n' "$changed" | while IFS= read -r file; do git add -- "$file"; done
          git commit \
            -m "chore(engine): regenerate control-ui catalog fallbacks after merge" \
            -m "The post-merge drift check failed on main at ${SHA}. catalog-fallbacks.json was regenerated by syncControlUiCatalogFallbackBaseline (AGENTS.md rule 6)." \
            -m "Co-authored-by: Taofik Bishi <189563683+stabrea@users.noreply.github.com>"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(engine): regenerate control-ui catalog fallbacks after merge" \
            --body "Opened automatically by engine-lint-baselines.yml after the post-merge drift check failed on main at ${SHA}. The only change is the regenerated catalog-fallbacks.json. Needs the gate-change review before merge. Note: pull requests opened with the default GITHUB_TOKEN do not start PR workflows, so PR checks need a manual rerun or push."
