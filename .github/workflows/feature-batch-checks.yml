name: Feature batch checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-batch-ci*'
      - 'scripts/feature-batch-ci-window-tooling/**'
      - 'scripts/feature-batch-ci-named/**'
      - '.github/workflows/feature-batch-checks.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-batch-ci*'
      - 'scripts/feature-batch-ci-window-tooling/**'
      - 'scripts/feature-batch-ci-named/**'
      - '.github/workflows/feature-batch-checks.yml'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-batch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  feature-batch:
    name: Named feature tests on ${{ matrix.os }} (${{ matrix.label }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # PRs: Linux runs the full named suite in ten shards; Windows runs only the named tests the PR
        # touches plus a fixed Windows smoke set. Smaller shards stay below the 15-minute cap.
        # Main after merge and nightly: the full suite on all three systems. macOS for PRs touching
        # OS-specific code is in os-specific-checks.yml.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","shard":"1/10","label":"1/10","scope":"all"},{"os":"ubuntu-latest","shard":"2/10","label":"2/10","scope":"all"},{"os":"ubuntu-latest","shard":"3/10","label":"3/10","scope":"all"},{"os":"ubuntu-latest","shard":"4/10","label":"4/10","scope":"all"},{"os":"ubuntu-latest","shard":"5/10","label":"5/10","scope":"all"},{"os":"ubuntu-latest","shard":"6/10","label":"6/10","scope":"all"},{"os":"ubuntu-latest","shard":"7/10","label":"7/10","scope":"all"},{"os":"ubuntu-latest","shard":"8/10","label":"8/10","scope":"all"},{"os":"ubuntu-latest","shard":"9/10","label":"9/10","scope":"all"},{"os":"ubuntu-latest","shard":"10/10","label":"10/10","scope":"all"},{"os":"windows-latest","shard":"1/1","label":"touched","scope":"touched"}]' || '[{"os":"ubuntu-latest","shard":"1/3","label":"1/3","scope":"all"},{"os":"ubuntu-latest","shard":"2/3","label":"2/3","scope":"all"},{"os":"ubuntu-latest","shard":"3/3","label":"3/3","scope":"all"},{"os":"windows-latest","shard":"1/6","label":"1/6","scope":"all"},{"os":"windows-latest","shard":"2/6","label":"2/6","scope":"all"},{"os":"windows-latest","shard":"3/6","label":"3/6","scope":"all"},{"os":"windows-latest","shard":"4/6","label":"4/6","scope":"all"},{"os":"windows-latest","shard":"5/6","label":"5/6","scope":"all"},{"os":"windows-latest","shard":"6/6","label":"6/6","scope":"all"},{"os":"macos-latest","shard":"1/6","label":"1/6","scope":"all"},{"os":"macos-latest","shard":"2/6","label":"2/6","scope":"all"},{"os":"macos-latest","shard":"3/6","label":"3/6","scope":"all"},{"os":"macos-latest","shard":"4/6","label":"4/6","scope":"all"},{"os":"macos-latest","shard":"5/6","label":"5/6","scope":"all"},{"os":"macos-latest","shard":"6/6","label":"6/6","scope":"all"}]') }}
    env:
      CI: 'true'
      FEATURE_SHARD: ${{ matrix.shard }}
      FEATURE_SCOPE: ${{ matrix.scope }}
    steps:
      - name: Check out the feature commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Two commits so a PR's merge commit can be diffed against its base (HEAD^1).
          fetch-depth: ${{ matrix.scope == 'touched' && 2 || 1 }}
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify pins, install frozen dependencies, and run explicit feature checks
        run: node scripts/feature-batch-ci.mjs all
