name: Feature batch checks

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-batch-ci*'
      - 'scripts/feature-batch-ci-window-tooling/**'
      - 'scripts/feature-batch-ci-named/**'
      - '.github/workflows/feature-batch-checks.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-batch-ci*'
      - 'scripts/feature-batch-ci-window-tooling/**'
      - 'scripts/feature-batch-ci-named/**'
      - '.github/workflows/feature-batch-checks.yml'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-batch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feature-batch:
    name: Named feature tests on ${{ matrix.os }} (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # PRs: Linux runs the full named suite in four shards; Windows runs only the named tests the PR
        # touches plus a fixed Windows smoke set (the full Windows suite takes ~14 minutes, over the cap).
        # Main after merge and nightly: the full suite on all three systems. macOS for PRs touching
        # OS-specific code is in os-specific-checks.yml.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","shard":"1/4","label":"1/4","scope":"all"},{"os":"ubuntu-latest","shard":"2/4","label":"2/4","scope":"all"},{"os":"ubuntu-latest","shard":"3/4","label":"3/4","scope":"all"},{"os":"ubuntu-latest","shard":"4/4","label":"4/4","scope":"all"},{"os":"windows-latest","shard":"1/1","label":"touched","scope":"touched"}]' || '[{"os":"ubuntu-latest","shard":"1/2","label":"1/2","scope":"all"},{"os":"ubuntu-latest","shard":"2/2","label":"2/2","scope":"all"},{"os":"windows-latest","shard":"1/2","label":"1/2","scope":"all"},{"os":"windows-latest","shard":"2/2","label":"2/2","scope":"all"},{"os":"macos-latest","shard":"1/2","label":"1/2","scope":"all"},{"os":"macos-latest","shard":"2/2","label":"2/2","scope":"all"}]') }}
    env:
      CI: 'true'
      FEATURE_SHARD: ${{ matrix.shard }}
      FEATURE_SCOPE: ${{ matrix.scope }}
    steps:
      - name: Check out the feature commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Two commits so a PR's merge commit can be diffed against its base (HEAD^1).
          fetch-depth: ${{ matrix.scope == 'touched' && 2 || 1 }}
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify pins, install frozen dependencies, and run explicit feature checks
        run: node scripts/feature-batch-ci.mjs all
