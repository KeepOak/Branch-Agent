name: Feature batch checks

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-batch-ci*'
      - 'scripts/feature-batch-ci-window-tooling/**'
      - 'scripts/feature-batch-ci-named/**'
      - '.github/workflows/feature-batch-checks.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'window/**'
      - 'scripts/feature-batch-ci*'
      - 'scripts/feature-batch-ci-window-tooling/**'
      - 'scripts/feature-batch-ci-named/**'
      - '.github/workflows/feature-batch-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-batch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-batch:
    name: Named feature tests (${{ matrix.lane }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        # Engine tests alone took 11 min on windows-latest (2026-10-05); two engine shards plus the
        # window lane keep every job well under the 15-minute cap.
        lane: ['engine:1/2', 'engine:2/2', 'window']
    env:
      CI: 'true'
    steps:
      - name: Check out the feature commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify pins, install frozen dependencies, and run explicit feature checks
        run: node scripts/feature-batch-ci.mjs all ${{ matrix.lane }}
