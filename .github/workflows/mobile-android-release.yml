name: Mobile Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach a signed APK to. Leave empty for an artifact-only build.
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-release.yml'

permissions:
  contents: read

# One shared key for push, release, and workflow_dispatch. GitHub evaluates this
# before jobs run, so a per-tag key cannot include the push-path resolved tag.
# cancel-in-progress: false so a second trigger queues instead of cancelling an upload.
concurrency:
  group: mobile-android-release
  cancel-in-progress: false

jobs:
  resolve-tag:
    if: github.repository == 'KeepOak/Branch-Agent'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_attach: ${{ steps.resolve.outputs.should_attach }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || '' }}
          COMMIT_SHA: ${{ github.sha }}
        run: node mobile/scripts/android-release.mjs --resolve-tag >> "$GITHUB_OUTPUT"

  apk:
    needs: [resolve-tag]
    if: github.repository == 'KeepOak/Branch-Agent'
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false
          add-job-summary: never

      - name: Set up the Android SDK
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="$HOME/.android-sdk"
          CMDLINE_TOOLS_VERSION="15859902"
          CMDLINE_TOOLS_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          ARCHIVE="commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          URL="https://dl.google.com/android/repository/${ARCHIVE}"
          if [[ ! -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
            curl -fsSL --connect-timeout 10 --max-time 300 "${URL}" -o "${RUNNER_TEMP}/${ARCHIVE}"
            printf '%s  %s\n' "${CMDLINE_TOOLS_SHA256}" "${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check -
            rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            unzip -q "${RUNNER_TEMP}/${ARCHIVE}" -d "${ANDROID_SDK_ROOT}/cmdline-tools"
            mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_SDK_ROOT}/build-tools/36.0.0" >> "${GITHUB_PATH}"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || [[ "${PIPESTATUS[1]}" -eq 0 ]]
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Same package Gradle ndkVersion asks for (React Native 0.86 / Expo 57: 27.1.12297006).
      # Install it here so a flaky Google download is retried without restarting the Gradle build.
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
          key: android-ndk-27.1.12297006

      - name: Install Android NDK
        env:
          NDK_PACKAGE: ndk;27.1.12297006
        run: |
          set -euo pipefail
          ndk_dir="${ANDROID_SDK_ROOT}/ndk/27.1.12297006"
          if [[ -f "${ndk_dir}/source.properties" ]]; then
            echo "${NDK_PACKAGE} already present"
            exit 0
          fi
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || [[ "${PIPESTATUS[1]}" -eq 0 ]]
          attempt=1
          max_attempts=3
          delay=15
          while (( attempt <= max_attempts )); do
            echo "Installing ${NDK_PACKAGE} (attempt ${attempt}/${max_attempts})"
            if sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install "${NDK_PACKAGE}" \
              && [[ -f "${ndk_dir}/source.properties" ]]; then
              echo "Installed ${NDK_PACKAGE}"
              exit 0
            fi
            if (( attempt == max_attempts )); then
              echo "Failed to install ${NDK_PACKAGE} after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "NDK download failed; retrying in ${delay}s" >&2
            rm -rf "${ndk_dir}"
            sleep "${delay}"
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done

      - name: Install the phone app
        working-directory: mobile
        run: npm ci

      - name: Check the release plan
        working-directory: mobile
        run: npx jest src/build/androidRelease.test.ts src/build/androidBuild.test.ts

      - name: Plan version and signing
        id: plan
        working-directory: mobile
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node scripts/android-release.mjs >> "$GITHUB_OUTPUT"

      - name: Decode the PKCS12 keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_B64}" ]]; then
            echo "Release keystore secret is missing or empty" >&2
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/android-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build the Android APK
        working-directory: mobile
        env:
          REQUIRE_ANDROID_RELEASE_SIGNING: '1'
          ANDROID_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.plan.outputs.version }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npm run build:android

      - name: Stage the APK
        id: stage
        env:
          APK_NAME: ${{ steps.plan.outputs.apk_name }}
          SIGNED: ${{ steps.plan.outputs.signed }}
          ANDROID_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          source_apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          mkdir -p "${RUNNER_TEMP}/apk"
          apk_path="${RUNNER_TEMP}/apk/${APK_NAME}"
          cp "$source_apk" "$apk_path"
          echo "apk_path=${apk_path}" >> "$GITHUB_OUTPUT"
          if [[ "$SIGNED" == "true" ]]; then
            node mobile/scripts/android-release.mjs --sha256 "$apk_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.stage.outputs.apk_path }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          
          # Run apksigner verify and capture the full output
          if ! certs="$(apksigner verify --print-certs "$APK_PATH" 2>&1)"; then
            echo "APK signature verification failed or APK is unsigned" >&2
            echo "$certs" >&2
            exit 1
          fi
          
          # Reject debug-signed APKs
          if printf '%s\n' "$certs" | grep -F -q 'CN=Android Debug'; then
            echo "Release APK is signed with the Android Debug certificate" >&2
            exit 1
          fi
          
          # Verify the certificate fingerprint matches the expected release key
          if [[ -z "${EXPECTED_CERT_SHA256}" ]]; then
            echo "ANDROID_RELEASE_CERT_SHA256 is not set; cannot verify certificate fingerprint" >&2
            exit 1
          fi
          
          # Extract SHA-256 digest from apksigner output
          actual_sha256="$(printf '%s\n' "$certs" | grep -oP 'Signer #1 certificate SHA-256 digest: \K[a-fA-F0-9:]+' | head -1)"
          
          if [[ -z "${actual_sha256}" ]]; then
            echo "Could not extract SHA-256 certificate fingerprint from apksigner output" >&2
            echo "apksigner output:" >&2
            echo "$certs" >&2
            exit 1
          fi
          
          # Lowercase and strip colons/whitespace on BOTH sides (GitHub var vs apksigner/keytool).
          actual_normalized="$(node mobile/scripts/android-release.mjs --normalize-cert-sha256 "$actual_sha256")"
          expected_normalized="$(node mobile/scripts/android-release.mjs --normalize-cert-sha256 "$EXPECTED_CERT_SHA256")"
          
          if [[ "${actual_normalized}" != "${expected_normalized}" ]]; then
            echo "Certificate fingerprint mismatch" >&2
            echo "Expected: ${EXPECTED_CERT_SHA256}" >&2
            echo "Actual:   ${actual_sha256}" >&2
            exit 1
          fi
          
          echo "✓ APK signature verified"
          echo "✓ Certificate fingerprint matches release key: ${actual_sha256}"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 14

      - name: Attach the signed APK to the GitHub release
        if: steps.plan.outputs.attach_release == 'true' && needs.resolve-tag.outputs.should_attach == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.release_tag }}
          APK_PATH: ${{ steps.stage.outputs.apk_path }}
          APK_NAME: ${{ steps.plan.outputs.apk_name }}
          SHA256_PATH: ${{ steps.stage.outputs.sha256_path }}
          SHA256_NAME: ${{ steps.stage.outputs.sha256_name }}
          VERSIONCODE_PATH: ${{ steps.stage.outputs.versioncode_path }}
          VERSIONCODE_NAME: ${{ steps.stage.outputs.versioncode_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${APK_PATH}#${APK_NAME}" \
            "${SHA256_PATH}#${SHA256_NAME}" \
            "${VERSIONCODE_PATH}#${VERSIONCODE_NAME}" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
          stale="$(
            gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' \
              | node mobile/scripts/android-release.mjs --stale-versioncode-assets "$APK_NAME" "$VERSIONCODE_NAME" \
              || true
          )"
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            gh release delete-asset "$TAG" "$name" --repo "${GITHUB_REPOSITORY}" --yes
          done <<< "$stale"

      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/android-release.p12"

      - name: Summary
        if: always() && steps.plan.outcome == 'success'
        env:
          ATTACH: ${{ steps.plan.outputs.attach_release }}
          APK_NAME: ${{ steps.plan.outputs.apk_name }}
          TAG: ${{ steps.plan.outputs.release_tag }}
          VERSION_CODE: ${{ steps.plan.outputs.version_code }}
        run: |
          set -euo pipefail
          {
            echo "## Signed Android APK"
            echo
            echo "- File: \`$APK_NAME\`"
            echo "- Checksum: \`${APK_NAME}.sha256\`"
            echo "- versionCode: \`${APK_NAME}.versioncode.${VERSION_CODE}\`"
            if [[ "$ATTACH" == "true" ]]; then
              echo "- Release asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
              echo "- Checksum asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}.sha256"
              echo "- versionCode asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}.versioncode.${VERSION_CODE}"
            else
              echo "- Kept as a workflow artifact only (no release tag on this run)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
