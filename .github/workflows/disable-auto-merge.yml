name: Disable auto-merge

# Runs from the default branch. Do not check out or execute pull request code.
# Auto-merge (including squash) is not allowed; the PR Closer merges by hand.
on:
  pull_request_target:
    types: [auto_merge_enabled]

permissions:
  pull-requests: write

concurrency:
  group: disable-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  disable:
    name: Disable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge and explain
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT: Auto-merge is not allowed. The PR Closer merges by hand as a merge commit pinned to the reviewed head SHA after merge-gate is green and a MERGE verdict exists on that head.
          COMMENT_FAILED: Auto-merge could not be turned off. The PR Closer must merge by hand as a merge commit pinned to the reviewed head SHA after merge-gate is green and a MERGE verdict exists on that head.
        run: |
          set -euo pipefail
          if gh api graphql \
            -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{id}}}' \
            -f id="$PR_ID"
          then
            gh pr comment "$PR_NUMBER" --body "$COMMENT"
          else
            gh pr comment "$PR_NUMBER" --body "$COMMENT_FAILED"
            exit 1
          fi
