name: Gate files fresh

# Runs from the default branch via pull_request_target. A pull request cannot change this
# workflow, check out its own tree, or execute its own files. Permissions stay read-only.
# The helper reads PR commits, compares, and file contents through the GitHub REST API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gate-files-fresh-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  gate-files-fresh:
    name: gate-files-fresh
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test the gate-files-fresh helper
        run: node --test scripts/check-gate-files-fresh.test.mjs
      - name: Fail stale copies of merge-gate files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_REF: ${{ github.event.repository.default_branch }}
          MERGE_GATE_WAIT_SECONDS: '480'
        run: node scripts/check-gate-files-fresh.mjs
