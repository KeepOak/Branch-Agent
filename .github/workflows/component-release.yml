name: GitHub component release
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.catch_up && 'component-release-catch-up' || github.workflow }}

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  schedule:
    # Backup only. Scheduled slots are often dropped; the catch-up job releases merges
    # that landed inside the 25-minute window. Offset from the top of the hour.
    - cron: '7,37 * * * *'
  pull_request:
    paths:
      - 'desktop/scripts/release-*'
      - 'desktop/scripts/make-component-release.mjs'
      - 'desktop/scripts/publish-component-release.mjs'
      - 'desktop/scripts/component-release-readiness.mjs'
      - 'desktop/scripts/production-engine-smoke*'
      - 'desktop/scripts/bundle-node.mjs'
      - 'desktop/src/component-update*'
      - 'desktop/src/desktop-update*'
      - 'engine/pnpm-lock.yaml'
      - 'engine/pnpm-workspace.yaml'
      - '.github/workflows/component-release.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Stop after readiness and identity; do not build natives or publish'
        required: false
        default: false
        type: boolean
      force:
        description: 'Release the current origin/main commit even if failed checks would skip. Dispatch only; ignored on push and schedule. Identity, window, native, and publish still have to pass.'
        required: false
        default: false
        type: boolean
      catch_up:
        description: 'Internal catch-up retry marker for this main head. Do not set by hand.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Release runs share one group and never cancel an in-flight publish. Queued runs collapse to the
# newest pending run. Push and schedule releases wait until the latest release is more than 25
# minutes old. The catch-up job, in its own group, waits out that window and dispatches one
# follow-up when main is still ahead. Pull requests: a new push replaces the previous check.
concurrency:
  group: github-component-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readiness:
    if: github.repository == 'KeepOak/Branch-Agent' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      commit: ${{ steps.check.outputs.commit }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check if a release is needed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GATE_WAIT_SECONDS: '240'
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: &component-release-readiness-check |
          set -euo pipefail
          note() {
            printf '%s\n' "$1" >&2
            if [[ "${RECORD_SUMMARY:-}" == "1" && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          decide_scheduled() {
            git fetch origin main
            local main_commit latest_release latest_commit failed_checks latest_identity latest_skip published_at force_release
            force_release=false
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${FORCE_RELEASE:-}" == "true" ]]; then
              force_release=true
            fi
            main_commit="$(git rev-parse origin/main)"
            latest_release=""
            published_at=""
            latest_commit=""
            latest_identity="$(node desktop/scripts/component-release-readiness.mjs load-latest-release --repo KeepOak/Branch-Agent)"
            latest_skip="$(node -p 'JSON.parse(process.argv[1]).skip === true ? "true" : "false"' "$latest_identity")"
            if [[ "$latest_skip" == "true" ]]; then
              note "Could not load the latest release at $main_commit (checks-unavailable); skipping release"
              printf '%s %s %s\n' false "$main_commit" checks-unavailable
              return
            fi
            latest_release="$(node -p 'JSON.parse(process.argv[1]).latestRelease || ""' "$latest_identity")"
            published_at="$(node -p 'JSON.parse(process.argv[1]).publishedAt || ""' "$latest_identity")"
            latest_commit="$(node -p 'JSON.parse(process.argv[1]).latestCommit || ""' "$latest_identity")"
            if [[ -z "$latest_release" ]]; then
              note "No previous release found; proceeding with release"
              printf '%s %s %s\n' true "$main_commit" ok
              return
            fi
            if [[ "$main_commit" == "$latest_commit" ]]; then
              note "Main has not changed since $latest_release ($latest_commit); skipping release"
              printf '%s %s %s\n' false "$main_commit" already-released
              return
            fi
            # Cooldown skips stay on the latest-release identity above. Check runs are only for a release we may publish.
            if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              if ! node desktop/scripts/component-release-readiness.mjs "$published_at"; then
                note "Latest release $latest_release was published at $published_at; waiting until it is more than 25 minutes old"
                printf '%s %s %s\n' false "$main_commit" cooldown
                return
              fi
            fi
            # Missing or pending checks do not block. A listing that fails, or more than
            # 300 check runs, skips this release. Over-cap is its own reason and never
            # catch-up. One rerun of failed jobs, then catch-up retries a failed-checks
            # or checks-unavailable skip once per main head. Force is dispatch-only.
            if [[ "$force_release" == "true" ]]; then
              note "Forced workflow_dispatch release of $main_commit; skipping the failed-checks gate"
              printf '%s %s %s\n' true "$main_commit" ok
              return
            fi
            failed_decision="$(node desktop/scripts/component-release-readiness.mjs resolve-failed-checks --sha "$main_commit")"
            read -r failed_checks decision_skip decision_reason < <(node -e 'const d = JSON.parse(process.argv[1]); process.stdout.write(d.failedCount + " " + d.skip + " " + d.reason + "\n")' "$failed_decision")
            if [[ "$decision_skip" == "true" && "$failed_checks" == "0" ]]; then
              if [[ "$decision_reason" == "checks-over-cap" ]]; then
                note "Check runs at $main_commit exceed the cap; skipping release"
                printf '%s %s %s\n' false "$main_commit" checks-over-cap
                return
              fi
              note "Could not confirm checks at $main_commit ($decision_reason); skipping release"
              printf '%s %s %s\n' false "$main_commit" checks-unavailable
              return
            fi
            if [[ "$failed_checks" != "0" ]]; then
              note "Main has $failed_checks failed check(s) at $main_commit; skipping release"
              printf '%s %s %s\n' false "$main_commit" failed-checks
              return
            fi
            note "Main has new changes since $latest_release and no failed checks; proceeding with release"
            printf '%s %s %s\n' true "$main_commit" ok
          }

          should_release="false"
          commit=""
          skip_reason=""

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "scheduled rehearsal (does not decide this pull-request build):"
            RECORD_SUMMARY=0 decide_scheduled >/dev/null || echo "scheduled rehearsal could not finish" >&2
            node desktop/scripts/component-release-readiness.mjs "2000-01-01T00:00:00Z"
            should_release="true"
            commit="$(git rev-parse HEAD)"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            should_release="true"
            commit="$(git rev-parse HEAD)"
          else
            RECORD_SUMMARY=1
            read -r should_release commit skip_reason < <(decide_scheduled)
          fi

          case "$skip_reason" in
            cooldown|failed-checks|checks-unavailable|checks-over-cap) ;;
            *) skip_reason="" ;;
          esac
          printf 'should_release=%s\ncommit=%s\nskip_reason=%s\n' "$should_release" "$commit" "$skip_reason" >> "$GITHUB_OUTPUT"

  # jobs.<id>.permissions only accepts read/write/none, not expressions, so PR
  # rehearsal cannot share the write job. It checks out PR code and only counts.
  readiness-rehearsal:
    if: github.repository == 'KeepOak/Branch-Agent' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      commit: ${{ steps.check.outputs.commit }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check if a release is needed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GATE_WAIT_SECONDS: '240'
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: *component-release-readiness-check

  identity:
    needs: [readiness, readiness-rehearsal]
    if: always() && !cancelled() && ((needs.readiness.result == 'success' && needs.readiness.outputs.should_release == 'true') || (needs.readiness-rehearsal.result == 'success' && needs.readiness-rehearsal.outputs.should_release == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.readiness.outputs.commit || needs.readiness-rehearsal.outputs.commit }}
          persist-credentials: false
      - name: Freeze exact source and release identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            status="$(gh api "repos/KeepOak/Branch-Agent/compare/$commit...main" --jq .status)"
            [[ "$status" == "identical" || "$status" == "ahead" ]]
          fi
          base="$(node -p 'require("./desktop/package.json").version')"
          version="$base-build-${commit:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$base"
            version="$base"
          fi
          printf 'commit=%s\nversion=%s\n' "$commit" "$version" >> "$GITHUB_OUTPUT"
  window:
    needs: [readiness, readiness-rehearsal, identity]
    if: always() && !cancelled() && needs.identity.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH_RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
      BRANCH_RELEASE_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Build one shared renderer from frozen source
        run: node desktop/scripts/release-build.mjs window "${{ runner.temp }}/shared-window"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-shared-window
          path: ${{ runner.temp }}/shared-window/
          if-no-files-found: error
          retention-days: 3
  # Wait for the shared renderer artifact before starting natives. Starting them in parallel
  # burns the 35-minute clock while window is still queued, and the 10-minute poll then fails.
  native:
    needs: [readiness, readiness-rehearsal, identity, window]
    if: always() && !cancelled() && needs.identity.result == 'success' && needs.window.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    env:
      BRANCH_RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
      BRANCH_RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      BRANCH_RELEASE_TARGET: ${{ matrix.target }}
      BRANCH_MACOS_SIGNING_IDENTITY: 30BBF0B68236AE05E063465C39DEA6C5B396B11C
      PNPM_STORE_DIR: ${{ github.workspace }}/.cache/pnpm-store
      PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.cache/pnpm-store
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Reuse the engine pnpm store and Electron zips. Cache misses must not fail a release.
      - name: Cache the engine pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.cache/pnpm-store
          key: component-release-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/pnpm-lock.yaml') }}
          restore-keys: |
            component-release-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: component-release-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            component-release-electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare stable macOS release signing identity
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          BRANCH_MACOS_SIGNING_P12: ${{ secrets.BRANCH_MACOS_SIGNING_P12 }}
          BRANCH_MACOS_SIGNING_PASSWORD: ${{ secrets.BRANCH_MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          # No identity at all: release-build.mjs signs ad-hoc and records signing "adhoc" in the release proof.
          # One secret without the other is a broken setup and fails here.
          if [ -z "$BRANCH_MACOS_SIGNING_P12" ] && [ -z "$BRANCH_MACOS_SIGNING_PASSWORD" ]; then
            echo "macOS signing: no signing identity configured. Building ad-hoc signed; Gatekeeper will warn on a downloaded copy, script installs are unaffected."
            exit 0
          fi
          test -n "$BRANCH_MACOS_SIGNING_P12" || { echo "macOS signing identity is incomplete: BRANCH_MACOS_SIGNING_P12 is not set" >&2; exit 1; }
          test -n "$BRANCH_MACOS_SIGNING_PASSWORD" || { echo "macOS signing identity is incomplete: BRANCH_MACOS_SIGNING_PASSWORD is not set" >&2; exit 1; }
          p12="$RUNNER_TEMP/branch-release-signing.p12"
          password="$RUNNER_TEMP/branch-release-signing-password"
          printf '%s' "$BRANCH_MACOS_SIGNING_P12" | base64 --decode > "$p12"
          printf '%s' "$BRANCH_MACOS_SIGNING_PASSWORD" > "$password"
          chmod 600 "$p12" "$password"
          archive="$RUNNER_TEMP/apple-codesign-0.29.0-aarch64-apple-darwin.tar.gz"
          curl -fsSL 'https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-aarch64-apple-darwin.tar.gz' -o "$archive"
          echo "d1a532150adaf90048260d76359261aa716abafc45c53c5dc18845029184334a  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "BRANCH_MACOS_SIGNING_P12_FILE=$p12" >> "$GITHUB_ENV"
          echo "BRANCH_MACOS_SIGNING_PASSWORD_FILE=$password" >> "$GITHUB_ENV"
          echo "BRANCH_MACOS_RCODESIGN=$RUNNER_TEMP/apple-codesign-0.29.0-aarch64-apple-darwin/rcodesign" >> "$GITHUB_ENV"
      - name: Check release inventory regressions
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          BRANCH_DESKTOP_TEST_DIST: ${{ github.workspace }}/desktop/dist
        run: |
          node "${{ github.workspace }}/desktop/scripts/prepare-release-layout-tests.mjs"
          node --test desktop/scripts/release-inventory.test.mjs desktop/scripts/production-engine-smoke.test.mjs desktop/scripts/release-source-freeze.test.mjs desktop/scripts/release-production-layout.test.mjs desktop/scripts/release-installers.test.mjs desktop/scripts/release-signing.test.mjs
      - name: Verify source slices and package native production components
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
          SHARED_WINDOW: ${{ runner.temp }}/shared-window
          BRANCH_RELEASE_WINDOW_READY: ${{ runner.temp }}/shared-window.ready
        run: |
          set -euo pipefail
          node desktop/scripts/release-build.mjs components "$RELEASE_ASSETS" "$SHARED_WINDOW" &
          build=$!
          artifact=""
          for attempt in $(seq 1 120); do
            artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "release-shared-window") | .id')"
            [ -n "$artifact" ] && break
            sleep 5
          done
          if [ -z "$artifact" ]; then kill "$build"; echo "The shared renderer artifact never arrived" >&2; exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/shared-window.zip"
          mkdir -p "$SHARED_WINDOW"
          if command -v unzip > /dev/null; then unzip -q "$RUNNER_TEMP/shared-window.zip" -d "$SHARED_WINDOW"
          else "$SYSTEMROOT/System32/tar.exe" -xf "$RUNNER_TEMP/shared-window.zip" -C "$SHARED_WINDOW"; fi
          touch "$BRANCH_RELEASE_WINDOW_READY"
          wait "$build"
      - name: Verify extracted macOS app signature
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/verified-macos-app"
          mkdir -p "$extracted"
          tar -xzf "$RELEASE_ASSETS/branch-desktop-${BRANCH_RELEASE_VERSION}-darwin-arm64.tar.gz" -C "$extracted"
          app="$extracted/Branch Agent.app"
          test -f "$app/Contents/_CodeSignature/CodeResources"
          test -L "$app/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          codesign --verify --deep --strict --verbose=2 "$app"
          node_hash="$(shasum -a 256 "$app/Contents/Resources/node/node" | cut -d' ' -f1)"
          recorded_node_hash="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).runtime.node.sha256' "$RELEASE_ASSETS/release-proof-darwin-arm64.json")"
          test "$node_hash" = "$recorded_node_hash"
          # The build declares how it signed; ad-hoc passes only when the release proof says "adhoc".
          signing="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).signing' "$RELEASE_ASSETS/release-proof-darwin-arm64.json")"
          report="$RUNNER_TEMP/mac-signature-report.txt"
          {
            codesign -dv --verbose=4 "$app"
            codesign -dr - "$app"
          } >"$report" 2>&1
          case "$signing" in
            identity)
              (cd "$extracted" && codesign -d --extract-certificates "$app" 2>/dev/null)
              fingerprint="$(openssl x509 -inform DER -in "$extracted/codesign0" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
              test "$fingerprint" = "$BRANCH_MACOS_SIGNING_IDENTITY"
              codesign -dr - "$app" 2>&1 | grep -Fx 'designated => identifier "com.electron.branch-agent" and certificate root = H"30bbf0b68236ae05e063465c39dea6c5b396b11c"'
              printf 'SHA1 Fingerprint=%s\n' "$fingerprint" >> "$report"
              ;;
            adhoc) echo "macOS signing: the release declares ad-hoc signing" ;;
            *) echo "release-proof-darwin-arm64.json declares no known signing: $signing" >&2; exit 1 ;;
          esac
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { pathToFileURL } from "node:url"; const mod = await import(pathToFileURL(process.argv[1])); if (process.env.BRANCH_MACOS_SIGNING_IDENTITY !== mod.macReleaseSigning.identitySha1) throw new Error("workflow signing identity differs from the pinned release identity"); const text = readFileSync(process.argv[2], "utf8"); const actual = (text.match(/SHA1 Fingerprint=([0-9A-Fa-f]+)/) || [])[1] || ""; mod.assertMacReleaseSignature(text, actual, process.argv[3]);' "$GITHUB_WORKSPACE/desktop/dist/mac-applications.js" "$report" "$signing"
          # The self-signed identity is stable but not notarized; report Gatekeeper's assessment.
          spctl -a -vv "$app" || true
      # Installers around the verified desktop package; each target's release proof lists its installer, so publish
      # attaches it and adds it to SHA256SUMS (desktop/INSTALLERS.md). Windows and macOS installers are optional and a
      # failure there never blocks a release. The Linux AppImage is how install.sh installs Linux, so it must build.
      # Code signing stays off until the owner adds its secrets and variables (desktop/INSTALLERS.md, "Left for the owner").
      # Unset or partly set prints one plain line and builds unsigned; it never fails a release or half-signs.
      # Secrets reach these steps only through env, and only on the target that uses them.
      - name: Code signing status
        continue-on-error: true
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ matrix.target == 'win32-x64' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'win32-x64' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'win32-x64' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.target == 'win32-x64' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ matrix.target == 'win32-x64' && vars.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ matrix.target == 'win32-x64' && vars.AZURE_SIGNING_PROFILE || '' }}
          APPLE_DEVELOPER_ID_P12: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_DEVELOPER_ID_P12 || '' }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_DEVELOPER_ID_PASSWORD || '' }}
          APPLE_NOTARY_KEY_ID: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER_ID: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
          APPLE_NOTARY_KEY: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_NOTARY_KEY || '' }}
        run: node desktop/scripts/release-signing.mjs status --target "$BRANCH_RELEASE_TARGET"
      - name: Make sure Inno Setup is available
        if: matrix.target == 'win32-x64'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build installers, signed only when configured
        id: installers
        continue-on-error: ${{ matrix.target != 'linux-x64' }}
        shell: bash
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
          AZURE_TENANT_ID: ${{ matrix.target == 'win32-x64' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'win32-x64' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'win32-x64' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.target == 'win32-x64' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ matrix.target == 'win32-x64' && vars.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ matrix.target == 'win32-x64' && vars.AZURE_SIGNING_PROFILE || '' }}
          APPLE_DEVELOPER_ID_P12: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_DEVELOPER_ID_P12 || '' }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_DEVELOPER_ID_PASSWORD || '' }}
          APPLE_NOTARY_KEY_ID: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER_ID: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
          APPLE_NOTARY_KEY: ${{ matrix.target == 'darwin-arm64' && secrets.APPLE_NOTARY_KEY || '' }}
        run: node desktop/scripts/release-installers.mjs --assets "$RELEASE_ASSETS" --version "$BRANCH_RELEASE_VERSION" --target "$BRANCH_RELEASE_TARGET" --out "$RUNNER_TEMP/installers"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.installers.outcome == 'success'
        continue-on-error: ${{ matrix.target != 'linux-x64' }}
        with:
          name: release-installers-${{ matrix.target }}
          path: ${{ runner.temp }}/installers/
          if-no-files-found: error
          retention-days: 7
      - name: Check compiled startup and update rollback
        env:
          BRANCH_DESKTOP_TEST_DIST: ${{ github.workspace }}/desktop/dist
        run: node --max-old-space-size=96 --test desktop/scripts/component-update.test.mjs desktop/scripts/desktop-update.test.mjs desktop/scripts/gateway-ready.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-native-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 3
  report:
    needs: [readiness, identity]
    if: always() && github.event_name != 'pull_request' && (needs.readiness.outputs.should_release != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record readiness without publishing
        env:
          SHOULD_RELEASE: ${{ needs.readiness.outputs.should_release }}
          RELEASE_COMMIT: ${{ needs.readiness.outputs.commit }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "dry_run=${DRY_RUN}"
          echo "should_release=${SHOULD_RELEASE}"
          echo "commit=${RELEASE_COMMIT}"
          echo "identity=${IDENTITY_RESULT}"
          echo "publish skipped"
  publish:
    needs: [readiness, readiness-rehearsal, identity, native]
    if: always() && !cancelled() && needs.identity.result == 'success' && needs.native.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-native-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      # Installers are optional on Windows and macOS. Each release proof lists the installer its target built,
      # so a listed installer that did not arrive, or arrived with other bytes, fails the checks below.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          pattern: release-installers-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: Verify the merged cross-target release directory without publishing
        if: github.event_name == 'pull_request'
        run: >-
          node --input-type=module -e 'const { verifyReleaseDirectory } = await import("./desktop/scripts/release-inventory.mjs");
          const proof = await verifyReleaseDirectory(process.argv[1], process.argv[2], process.argv[3]);
          console.log(JSON.stringify(proof.targets));'
          "${{ runner.temp }}/release-assets" "${{ needs.identity.outputs.commit }}" "${{ needs.identity.outputs.version }}"
      - name: Verify uploaded assets before exposing a stable update
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/publish-component-release.mjs "${{ runner.temp }}/release-assets" "${{ needs.identity.outputs.commit }}" "${{ needs.identity.outputs.version }}"
  # Starts mobile-android-release.yml after a published desktop release.
  dispatch-android-apk:
    needs: [identity, publish]
    if: github.event_name != 'pull_request' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the Android APK build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run mobile-android-release.yml -f tag=v${{ needs.identity.outputs.version }}
  # Waits out the 25-minute batching window, then starts one release if main moved.
  # The sleep is the catch-up, so this job is longer than the 15-minute check cap.
  # A failed publish still enters this job. It continues only when that commit is
  # still Latest; a rolled-back release exits here without dispatching.
  catch-up:
    needs: [readiness, identity, publish]
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.repository == 'KeepOak/Branch-Agent' && (needs.publish.result == 'success' || needs.publish.result == 'failure' || needs.readiness.outputs.skip_reason == 'cooldown' || needs.readiness.outputs.skip_reason == 'failed-checks' || needs.readiness.outputs.skip_reason == 'checks-unavailable')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: github-component-release-catch-up
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Wait for the release window, then dispatch if main is ahead
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GATE_WAIT_SECONDS: '60'
          SKIP_REASON: ${{ needs.readiness.outputs.skip_reason }}
        run: |
          set -euo pipefail
          note() {
            printf '%s\n' "$1" >&2
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          load_main_and_release() {
            git fetch origin main
            main_commit="$(git rev-parse origin/main)"
            latest_release=""
            published_at=""
            latest_commit=""
            latest_meta=$(node scripts/merge-gate-rate-limit.mjs gh -- api repos/KeepOak/Branch-Agent/releases/latest --jq '[.tag_name,.published_at] | @tsv' 2>/dev/null || echo "")
            if [[ -n "$latest_meta" ]]; then
              latest_release="${latest_meta%%$'\t'*}"
              published_at="${latest_meta#*$'\t'}"
              latest_commit=$(node scripts/merge-gate-rate-limit.mjs gh -- api repos/KeepOak/Branch-Agent/commits/"$latest_release" --jq .sha)
            fi
          }
          read_catch_up() {
            local decision
            decision="$(node desktop/scripts/component-release-readiness.mjs decide-catch-up --main "$main_commit" --latest "$latest_commit" --published-at "$published_at")"
            catch_dispatch="$(node -p 'JSON.parse(process.argv[1]).dispatch ? "true" : "false"' "$decision")"
            catch_wait_ms="$(node -p 'JSON.parse(process.argv[1]).waitMs' "$decision")"
            catch_reason="$(node -p 'JSON.parse(process.argv[1]).reason' "$decision")"
          }
          dispatch_release() {
            if [[ "$SKIP_REASON" == "failed-checks" || "$SKIP_REASON" == "checks-unavailable" ]]; then
              local runs_json latch latch_dispatch
              runs_json=$(node scripts/merge-gate-rate-limit.mjs gh -- api "repos/KeepOak/Branch-Agent/actions/workflows/component-release.yml/runs?head_sha=${main_commit}&event=workflow_dispatch&per_page=20")
              latch="$(node desktop/scripts/component-release-readiness.mjs decide-skip-catch-up --main "$main_commit" --reason "$SKIP_REASON" --runs "$runs_json")"
              latch_dispatch="$(node -p 'JSON.parse(process.argv[1]).dispatch ? "true" : "false"' "$latch")"
              note "$(node -p 'JSON.parse(process.argv[1]).reason' "$latch")"
              if [[ "$latch_dispatch" != "true" ]]; then
                return 0
              fi
            fi
            gh workflow run component-release.yml --ref main -f catch_up=true
            note "Dispatched component-release.yml on main"
          }
          main_commit=""
          latest_commit=""
          published_at=""
          catch_dispatch="false"
          catch_wait_ms="0"
          catch_reason=""
          load_main_and_release
          if [[ "${{ needs.publish.result }}" == "failure" ]]; then
            failed_gate="$(node desktop/scripts/component-release-readiness.mjs catch-up-after-failed-publish --latest "$latest_commit" --released "${{ needs.identity.outputs.commit }}")"
            failed_proceed="$(node -p 'JSON.parse(process.argv[1]).proceed ? "true" : "false"' "$failed_gate")"
            note "$(node -p 'JSON.parse(process.argv[1]).reason' "$failed_gate")"
            if [[ "$failed_proceed" != "true" ]]; then
              exit 0
            fi
          fi
          read_catch_up
          note "$catch_reason"
          if [[ "$catch_dispatch" == "true" ]]; then
            dispatch_release
            exit 0
          fi
          if ! [[ "$catch_wait_ms" =~ ^[0-9]+$ ]]; then
            echo "Catch-up wait was not a number: ${catch_wait_ms}" >&2
            exit 1
          fi
          max_sleep_seconds=$((26 * 60))
          sleep_seconds=$(( (catch_wait_ms + 999) / 1000 ))
          if (( sleep_seconds > max_sleep_seconds )); then
            sleep_seconds=$max_sleep_seconds
          fi
          if (( sleep_seconds == 0 )); then
            exit 0
          fi
          note "Sleeping ${sleep_seconds}s until the release window ends"
          sleep "$sleep_seconds"
          load_main_and_release
          read_catch_up
          note "$catch_reason"
          if [[ "$catch_dispatch" != "true" ]]; then
            exit 0
          fi
          dispatch_release
