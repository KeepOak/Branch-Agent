name: OpenClaw wording

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: openclaw-wording-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wording:
    name: OpenClaw wording
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR merge commit and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test the wording check
        run: node --test scripts/check-openclaw-wording.test.mjs
      - name: Fail new user-visible OpenClaw wording
        env:
          OPENCLAW_WORDING_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-openclaw-wording.mjs
