name: OpenClaw wording

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: openclaw-wording-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'converted_to_draft' }}

jobs:
  wording:
    name: OpenClaw wording
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR merge commit and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test the wording check
        run: node --test scripts/check-openclaw-wording.test.mjs
      - name: Fail new user-visible OpenClaw wording
        env:
          OPENCLAW_WORDING_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-openclaw-wording.mjs
