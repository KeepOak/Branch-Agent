name: CLI release checks

on:
  pull_request:
    paths:
      - 'docs/cli-release.md'
      - 'scripts/cli-release-*'
      - '.github/workflows/cli-release-checks.yml'
      - 'desktop/scripts/release-production-layout.mjs'
      - 'desktop/scripts/release-build.mjs'
      - 'engine/branch.mjs'
      - 'engine/package.json'
  push:
    branches: [main]
    paths:
      - 'docs/cli-release.md'
      - 'scripts/cli-release-*'
      - '.github/workflows/cli-release-checks.yml'
      - 'desktop/scripts/release-production-layout.mjs'
      - 'desktop/scripts/release-build.mjs'
      - 'engine/branch.mjs'
      - 'engine/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PNPM_STORE_DIR: ${{ github.workspace }}/.cache/pnpm-store
      PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.cache/pnpm-store
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Cache the engine pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.cache/pnpm-store
          key: cli-release-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/pnpm-lock.yaml') }}
          restore-keys: |
            cli-release-pnpm-${{ runner.os }}-${{ runner.arch }}-
            component-release-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Check the CLI release contract
        run: node --test scripts/cli-release-contract.test.mjs
      - name: Production-deploy the CLI and run --version, --help, and status --json
        env:
          BRANCH_FEATURE_BATCH_TEMP: ${{ runner.temp }}
        run: node scripts/cli-release-smoke.mjs
