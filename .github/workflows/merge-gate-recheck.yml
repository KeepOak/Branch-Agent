name: Merge gate recheck

# The gates fail fast when a check is not yet done. When a check workflow later succeeds on the same commit
# (a rerun after a flake, or a run that sat in the runner queue), this reruns each gate that ended unsuccessfully,
# so the gates never need to poll for long. scripts/merge-gate-recheck.mjs decides which gates to rerun.
on:
  workflow_run:
    # Every workflow that produces pull request checks, so a completed run from any of them rechecks the gates.
    # GitHub rejects a workflow_run trigger without this list ("workflow file issue"), and its docs do not
    # document glob patterns, so the names are listed. scripts/merge-gate-recheck.test.mjs fails when a
    # pull_request workflow is missing here. CodeQL is GitHub's default code-scanning setup (no file here).
    workflows:
      - Button crawl
      - Capability feature checks
      - CodeQL
      - Desktop checks
      - Engine build (PR)
      - Engine handoff checks
      - Engine lint baselines
      - Feature batch checks
      - Feature slice checks
      - Gate files fresh
      - GitHub component release
      - Harvest checks
      - Local worker measurement
      - macOS checks for OS-specific changes
      - Merge gate
      - Merge gate trusted
      - Mobile APK reinstall
      - Mobile checks
      - Non-merge-commit landing
      - OpenClaw wording
      - Personal info PR scan
      - Priority capability checks
      - Seedbank plugin distribution
      - Visual tour
      - Writing quality checks
    types: [completed]

permissions:
  actions: write

jobs:
  recheck:
    # The recheck's own completion must not start another recheck (it would loop). A content check that did not
    # succeed never needs a listing (the script skips it), so it does not start this job. Concurrency is set on
    # the job, not the workflow: a skipped job never joins the group, so it cannot cancel a recheck that is settling.
    if: (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target') && github.event.workflow_run.name != 'Merge gate recheck' && (github.event.workflow_run.name == 'Merge gate' || github.event.workflow_run.name == 'Merge gate trusted' || github.event.workflow_run.conclusion == 'success')
    # One recheck per head at a time; a newer event supersedes an older one, which sees the same or newer runs.
    concurrency:
      group: merge-gate-recheck-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # 15-minute cap (AGENTS.md rule 13). The 10-minute rate-limit wait and 30s settle share this job.
    timeout-minutes: 15
    steps:
      - name: Check out the default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up reviewed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Read the core API budget before this job
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_LABEL: merge-gate-recheck
        run: node scripts/github-api-budget.mjs before
      - name: Let a burst of completions settle
        # The concurrency group above cancels the run still waiting here when a newer completion for this SHA
        # arrives. A burst of N completions therefore reaches the listing once, not N times.
        run: sleep 30
      - name: Rerun each merge gate that ended unsuccessfully for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_KIND: ${{ (github.event.workflow_run.name == 'Merge gate' || github.event.workflow_run.name == 'Merge gate trusted') && 'gate' || 'content' }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          # Rate-limit waits for the listing and rerun (separate from the 30s settle). A 403/429 waits
          # here, then fails closed when this budget runs out. Does not change the recheck plan.
          MERGE_GATE_API_WAIT_SECONDS: '600'
        run: node scripts/merge-gate-recheck.mjs
      - name: Log the core API budget this job used
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_LABEL: merge-gate-recheck
        run: node scripts/github-api-budget.mjs after
