<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel pet reactions</title>
<style>
  :root { --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 13px/1.4 var(--font); background: #F8FAFB; color: #1B2228; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 16px; }
  h1 { font-size: 16px; margin: 0; }
  .note { color: #5C6770; }
  .panels { display: flex; flex-wrap: wrap; gap: 16px; }
  .panel { padding: 16px; border-radius: 12px; border: 1px solid #DCE2E6; }
  .panel.light { background: #F8FAFB; color: #1B2228; }
  .panel.dark { background: #11161A; color: #E6ECEF; border-color: #26303A; }
  .panel h2 { font-size: 13px; margin: 0 0 12px; font-weight: 600; }
  table { border-collapse: collapse; }
  th { font-weight: 500; text-align: left; padding: 0 12px 6px 0; opacity: .75; }
  td { padding: 0 12px 12px 0; vertical-align: bottom; }
  /* The stage leaves room above the pet for the 14 px hop. */
  .stage { position: relative; width: 72px; height: 64px; display: flex; align-items: flex-end; justify-content: center; }
  /* The old app's pet: a 24 × 20 canvas shown at 48 × 40, pixels kept square. */
  .stage canvas { width: 48px; height: 40px; image-rendering: pixelated; display: block; margin-bottom: 6px; }
  .flipped canvas { transform: scaleX(-1); }
  button { font: inherit; padding: 3px 10px; border-radius: 8px; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; opacity: .85; }
  button:hover { opacity: 1; }
  label { display: inline-flex; align-items: center; gap: 6px; }
  .err { color: #B3261E; }
</style>
</head>
<body>
<header>
  <h1>Pixel pet reactions</h1>
  <span class="note">Each pet rests as a still and moves only when a reaction plays.</span>
  <button type="button" data-all="pat">Play every pat</button>
  <button type="button" data-all="cheer">Play every cheer</button>
  <button type="button" data-all="notice">Play every notice</button>
  <label><input type="checkbox" id="still"> Keep things still</label>
</header>
<p class="note" id="msg" hidden></p>
<div class="panels" id="panels"></div>

<script type="module">
  const msg = document.getElementById("msg");
  let mod;
  try { mod = await import("./pixel-pets.js"); }
  catch (error) {
    msg.hidden = false; msg.className = "err";
    msg.textContent = "Couldn't load pixel-pets.js. Serve this folder over http (for example: npx serve) and open it again.";
    throw error;
  }
  const { PIXEL_PETS, REACTIONS, play, drawRest, reactionMs } = mod;
  const pets = Object.keys(PIXEL_PETS), reactions = Object.keys(REACTIONS);

  function cell(pet, reaction, theme) {
    const td = document.createElement("td");
    td.innerHTML = `<div class="stage"><canvas width="24" height="20" data-pet="${pet}" data-reaction="${reaction}" data-theme="${theme}"></canvas></div>`
      + `<button type="button">Replay ${reaction}</button>`;
    const cv = td.querySelector("canvas");
    drawRest(pet, cv);
    td.querySelector("button").addEventListener("click", () => play(pet, reaction, cv));
    return td;
  }
  function panel(theme, title) {
    const el = document.createElement("section");
    el.className = `panel ${theme}`;
    el.innerHTML = `<h2>${title}</h2><table><thead><tr><th></th>${reactions.map((r) => `<th>${r} · ${(reactionMs(r) / 1000).toFixed(2)} s</th>`).join("")}</tr></thead><tbody></tbody></table>`;
    const body = el.querySelector("tbody");
    for (const pet of pets) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<th>${PIXEL_PETS[pet].name}</th>`;
      for (const r of reactions) tr.appendChild(cell(pet, r, theme));
      body.appendChild(tr);
    }
    return el;
  }
  const panels = document.getElementById("panels");
  panels.append(panel("light", "Light · #F8FAFB"), panel("dark", "Dark · #11161A"));

  const playAll = (reaction) => Promise.all([...document.querySelectorAll(`canvas[data-reaction="${reaction}"]`)]
    .map((cv) => play(cv.dataset.pet, reaction, cv)));
  document.querySelectorAll("[data-all]").forEach((b) => b.addEventListener("click", () => playAll(b.dataset.all)));
  document.getElementById("still").addEventListener("change", (e) => {
    document.documentElement.toggleAttribute("data-still", e.target.checked);
  });
  window.pixelPets = { ...mod, playAll };
  document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
