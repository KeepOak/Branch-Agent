<!doctype html><html><head><meta charset="utf-8"><title>PR #2094 @ 8536e07d — composer-focus-dark</title><style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6e6e73;--side:#f5f5f7;--line:#e5e5ea;--acc:#2f6feb}
.dark{--bg:#1c1c1e;--fg:#f2f2f7;--mut:#98989d;--side:#232325;--line:#38383a;--acc:#5b9bff}
body{margin:0;font:14px -apple-system,Segoe UI,Inter,sans-serif;background:var(--bg);color:var(--fg)}
.frame{display:grid;grid-template-rows:40px 1fr 26px;grid-template-columns:230px 1fr;height:100vh}
.top{grid-column:1/3;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;background:var(--side)}
.skip{position:absolute;left:250px;top:6px;background:var(--acc);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;text-decoration:none}
.side{background:var(--side);border-right:1px solid var(--line);padding:10px}.side div{padding:7px 10px;border-radius:6px;color:var(--mut)}.side .on{background:var(--line);color:var(--fg)}
main{display:flex;flex-direction:column;padding:18px 28px;overflow:hidden}#main:focus{outline:none}
.msg{max-width:60%;padding:9px 12px;border-radius:12px;margin:6px 0;background:var(--side)}.me{align-self:flex-end;background:var(--acc);color:#fff}
.composer{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:8px}.composer textarea{width:100%;border:0;resize:none;background:transparent;color:var(--fg);font:inherit;height:44px}
:focus{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
h1{font-size:22px;margin:4px 0 14px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.status{grid-column:1/3;border-top:1px solid var(--line);font-size:11px;color:var(--mut);padding:5px 14px;background:var(--side)}
.cap{position:fixed;right:12px;bottom:34px;background:#ffd60a;color:#000;padding:8px 12px;border-radius:8px;font-size:12px;max-width:520px}
</style></head><body class="dark"><div class="frame" data-route="chat">
<a class="skip" href="#main" id="skip">Skip to the conversation</a>
<div class="top"><b>Branch</b><span style="color:var(--mut)">This computer</span></div>
<nav class="side"><div class="on">Chat</div><div>Trunks</div><div>Routines</div><div class="">Settings</div></nav>
<main id="main"><div class="msg me">Can you summarise my morning?</div><div class="msg">Sure — three meetings and two follow-ups. Want the details?</div><div class="composer"><textarea placeholder="Message Branch"></textarea></div></main>
<div class="status">v0.4.4 · ready</div></div>
<div class="cap" id="cap"></div>
<script>
// skipToMain verbatim from window/src/shell/WindowShell.tsx @ 8536e07d
function skipToMain(e, chat){const main=document.getElementById("main");if(!main)return;e.preventDefault();
const composer=chat?main.querySelector('.composer textarea, .composer [contenteditable="true"]'):null;
const heading=main.querySelector("h1");if(!composer&&heading)heading.setAttribute("tabindex","-1");(composer??heading??main).focus();}
const chat=document.querySelector('.frame').dataset.route==="chat";const s=document.getElementById('skip');
s.addEventListener('click',e=>skipToMain(e,chat));s.click();
const a=document.activeElement;document.getElementById('cap').textContent='PR #2094 @ 8536e07d — after activating "'+s.textContent+'": document.activeElement = <'+a.tagName.toLowerCase()+(a.getAttribute('tabindex')?' tabindex='+a.getAttribute('tabindex'):'')+'>'+(a.tagName==='H1'?' "'+a.textContent+'"':'')+' (dark mode)';
</script></body></html>
